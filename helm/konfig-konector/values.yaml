replicaCount: 1

image:
  repository: ""  # required — your registry, e.g. <account>.dkr.ecr.<region>.amazonaws.com/konfig-konector
  tag: latest
  pullPolicy: Always

aws:
  region: us-east-1

# Multi-account. Each entry renders a cluster-scoped AWSProvider that resources
# select with spec.providerRef (or namespaces select via the
# aws.konfig.io/provider annotation). roleArn is assumed from the operator role
# with sts:AssumeRole; see terraform/spoke for the matching spoke role.
providers: []
#  - name: prod
#    roleArn: arn:aws:iam::111122223333:role/konfig-konector-spoke
#    region: us-east-1
#    externalId: ""
#    allowedNamespaces: ["prod-*"]

# Name of the IAM role to bind to the operator ServiceAccount via EKS Pod Identity.
# You must create this role and association before installing.
operatorRoleArn: ""  # required — operator_role_arn output of the terraform module

leaderElection: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: konfig-controller

# Install CRDs as part of the Helm release.
installCRDs: true
