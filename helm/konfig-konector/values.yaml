replicaCount: 1

image:
  repository: ""  # required — your registry, e.g. <account>.dkr.ecr.<region>.amazonaws.com/konfig-konector
  tag: latest
  pullPolicy: Always

aws:
  region: us-east-1

# Name of the IAM role to bind to the operator ServiceAccount via EKS Pod Identity.
# You must create this role and association before installing.
operatorRoleArn: ""  # required — operator_role_arn output of the terraform module

leaderElection: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: konfig-controller

# Install CRDs as part of the Helm release.
installCRDs: true
