apiVersion: apps/v1
kind: Deployment
metadata:
  name: konfig-controller
  namespace: konfig-system
  labels:
    app: konfig-controller
    app.kubernetes.io/name: konfig-konector
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: konfig-controller
  template:
    metadata:
      labels:
        app: konfig-controller
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          {{- if .Values.aws.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.aws.credentialsSecret }}
          {{- end }}
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
