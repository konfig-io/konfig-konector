            type: string
          metadata:
            type: object
          spec:
            description: |-
              SSOAssignmentSpec defines the desired state of an IAM Identity Center
              account assignment. Creation and deletion are asynchronous; the controller
              polls the assignment operation status. Assignments only reconcile
              successfully from the account where the Identity Center instance lives.
            properties:
              instanceArn:
                description: |-
                  InstanceArn is the ARN of the IAM Identity Center instance. Immutable
                  after creation.
                minLength: 10
                type: string
                x-kubernetes-validations:
                - message: instanceArn is immutable
                  rule: self == oldSelf
              permissionSetRef:
                description: PermissionSetRef references the permission set to assign.
                properties:
                  arn:
                    description: |-
                      ARN is a direct IAM Identity Center permission set ARN.
                      If set, Name is ignored.
                    type: string
                  name:
                    description: Name of a PermissionSet CR in the same namespace.
                    type: string
                type: object
              principalId:
                description: |-
                  PrincipalId is the GUID of the Identity Center user or group.
                  Immutable after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: principalId is immutable
                  rule: self == oldSelf
              principalType:
                description: |-
                  PrincipalType is the type of the Identity Center principal. Immutable
                  after creation.
                enum:
                - USER
                - GROUP
                type: string
                x-kubernetes-validations:
                - message: principalType is immutable
                  rule: self == oldSelf
              targetId:
                description: |-
                  TargetId is the 12-digit AWS account ID the assignment targets.
                  Immutable after creation.
                minLength: 12
                type: string
                x-kubernetes-validations:
                - message: targetId is immutable
                  rule: self == oldSelf
              targetType:
                default: AWS_ACCOUNT
                description: |-
                  TargetType is the entity type the assignment targets. Only AWS_ACCOUNT
                  is supported.
                enum:
                - AWS_ACCOUNT
                type: string
            required:
            - instanceArn
            - permissionSetRef
            - principalId
            - principalType
            - targetId
            type: object
          status:
            description: SSOAssignmentStatus defines the observed state of SSOAssignment.
