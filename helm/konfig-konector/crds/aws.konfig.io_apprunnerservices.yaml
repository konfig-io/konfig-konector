  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: apprunnerservices.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: AppRunnerService
    listKind: AppRunnerServiceList
    plural: apprunnerservices
    singular: apprunnerservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serviceUrl
      name: URL
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AppRunnerService is the Schema for managing AWS App Runner services.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppRunnerServiceSpec defines the desired state of an App
              Runner service.
            properties:
              healthCheckConfiguration:
                description: HealthCheckConfiguration configures the service health
                  check.
                properties:
                  healthyThreshold:
                    description: HealthyThreshold is consecutive successes before
                      healthy.
                    format: int32
                    minimum: 1
                    type: integer
                  interval:
                    description: Interval between health checks in seconds.
                    format: int32
                    minimum: 1
                    type: integer
                  path:
                    description: Path health check requests are sent to (HTTP only).
                    type: string
                  protocol:
                    description: Protocol used for health checks (TCP or HTTP).
                    enum:
                    - TCP
                    - HTTP
                    type: string
                  timeout:
                    description: Timeout for a health check response in seconds.
                    format: int32
                    minimum: 1
                    type: integer
                  unhealthyThreshold:
                    description: UnhealthyThreshold is consecutive failures before
                      unhealthy.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              instanceConfiguration:
                description: InstanceConfiguration configures service instances.
                properties:
                  cpu:
                    description: CPU units reserved for each instance (e.g. "1024",
                      "1 vCPU").
                    type: string
                  instanceRoleArn:
                    description: InstanceRoleArn is a direct IAM role ARN the service
                      instances assume.
                    type: string
                  instanceRoleRef:
                    description: InstanceRoleRef references an IAMRole CR for the
                      instance role.
                    properties:
                      arn:
                        description: |-
                          ARN is a direct AWS IAM role ARN.
                          If set, Name and Namespace are ignored.
                        type: string
                      name:
                        description: Name of an IAMRole CR in the same namespace.
                        type: string
                      namespace:
                        description: Namespace of the IAMRole CR. Defaults to the
                          referring object's namespace.
                        type: string
                    type: object
                  memory:
                    description: Memory reserved for each instance (e.g. "2048", "2
                      GB").
                    type: string
                type: object
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
