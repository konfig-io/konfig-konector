                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              serviceName:
                description: ServiceName is the name of the service. Immutable after
                  creation.
                maxLength: 40
                minLength: 4
                type: string
                x-kubernetes-validations:
                - message: serviceName is immutable
                  rule: self == oldSelf
              sourceConfiguration:
                description: SourceConfiguration describes the source deployed to
                  the service.
                properties:
                  authenticationConfiguration:
                    description: AuthenticationConfiguration configures source access.
                    properties:
                      accessRoleArn:
                        description: |-
                          AccessRoleArn is a direct IAM role ARN granting App Runner access to
                          the ECR image (required for private ECR).
                        type: string
                      accessRoleRef:
                        description: AccessRoleRef references an IAMRole CR for the
                          access role.
                        properties:
                          arn:
                            description: |-
                              ARN is a direct AWS IAM role ARN.
                              If set, Name and Namespace are ignored.
                            type: string
                          name:
                            description: Name of an IAMRole CR in the same namespace.
                            type: string
                          namespace:
                            description: Namespace of the IAMRole CR. Defaults to
                              the referring object's namespace.
                            type: string
                        type: object
                    type: object
                  autoDeploymentsEnabled:
                    description: AutoDeploymentsEnabled starts a deployment on each
                      image change.
                    type: boolean
                  imageRepository:
                    description: ImageRepository describes the source image repository.
                    properties:
                      imageConfiguration:
                        description: ImageConfiguration configures how the image runs.
                        properties:
                          port:
                            description: Port the application listens on in the container.
                              Default 8080.
                            type: string
                          runtimeEnvironmentVariables:
                            additionalProperties:
                              type: string
                            description: RuntimeEnvironmentVariables available to
                              the running service.
                            type: object
                          startCommand:
                            description: StartCommand overrides the image's default
                              start command.
                            type: string
                        type: object
                      imageIdentifier:
                        description: ImageIdentifier is the image name (ECR) or full
                          URI (ECR Public).
                        minLength: 1
                        type: string
                      imageRepositoryType:
                        description: ImageRepositoryType is the repository provider.
                        enum:
                        - ECR
                        - ECR_PUBLIC
                        type: string
                    required:
                    - imageIdentifier
                    - imageRepositoryType
                    type: object
                required:
                - imageRepository
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply.
                type: object
            required:
            - serviceName
            - sourceConfiguration
            type: object
          status:
            description: AppRunnerServiceStatus defines the observed state of AppRunnerService.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              serviceArn:
                description: ServiceARN is the ARN of the App Runner service.
                type: string
              serviceId:
                description: ServiceID is the App Runner generated ID of the service.
                type: string
              serviceUrl:
                description: ServiceURL is the subdomain URL of the running service.
                type: string
              status:
                description: Status is the current service state (e.g. RUNNING).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
