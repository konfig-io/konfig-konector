---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: appscalingpolicies.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: AppScalingPolicy
    listKind: AppScalingPolicyList
    plural: appscalingpolicies
    singular: appscalingpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.policyArn
      name: Policy-ARN
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AppScalingPolicy is the Schema for managing Application Auto
          Scaling policies.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AppScalingPolicySpec defines the desired state of an Application Auto
              Scaling scaling policy.
            properties:
              policyName:
                description: PolicyName is the name of the scaling policy. Immutable
                  after creation.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: policyName is immutable
                  rule: self == oldSelf
              policyType:
                description: PolicyType is the scaling policy type.
                enum:
                - TargetTrackingScaling
                - StepScaling
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              resourceId:
                description: ResourceID of the scalable target (inline alternative
                  to targetRef).
                type: string
              scalableDimension:
                description: ScalableDimension of the scalable target (inline alternative
                  to targetRef).
                type: string
              serviceNamespace:
                description: ServiceNamespace of the scalable target (inline alternative
                  to targetRef).
                type: string
              stepScalingConfiguration:
                description: StepScalingConfiguration configures a StepScaling policy.
                properties:
                  adjustmentType:
                    description: 'AdjustmentType: ChangeInCapacity, PercentChangeInCapacity,
                      or ExactCapacity.'
                    enum:
                    - ChangeInCapacity
                    - PercentChangeInCapacity
                    - ExactCapacity
                    type: string
                  cooldown:
                    description: Cooldown between scaling activities in seconds.
                    format: int32
                    type: integer
                  metricAggregationType:
                    description: 'MetricAggregationType: Average, Minimum, or Maximum.'
                    enum:
                    - Average
                    - Minimum
                    - Maximum
                    type: string
                  minAdjustmentMagnitude:
                    description: MinAdjustmentMagnitude for PercentChangeInCapacity
                      adjustments.
                    format: int32
                    type: integer
                  stepAdjustments:
                    description: StepAdjustments are the scaling steps.
                    items:
                      description: AppScalingStepAdjustment defines one step of a
                        step scaling policy.
                      properties:
                        metricIntervalLowerBound:
                          description: MetricIntervalLowerBound is the lower bound
                            of the step (difference from threshold).
                          type: number
                        metricIntervalUpperBound:
                          description: MetricIntervalUpperBound is the upper bound
                            of the step (difference from threshold).
                          type: number
                        scalingAdjustment:
                          description: ScalingAdjustment is the amount to scale by
                            (interpreted per adjustmentType).
                          format: int32
                          type: integer
                      required:
                      - scalingAdjustment
                      type: object
                    minItems: 1
                    type: array
                required:
                - adjustmentType
                - stepAdjustments
                type: object
              targetRef:
                description: |-
                  TargetRef references a ScalableTarget CR whose serviceNamespace,
                  resourceId and scalableDimension the policy applies to. Either targetRef
                  or the inline serviceNamespace/resourceId/scalableDimension must be set.
                properties:
                  name:
                    description: Name of a ScalableTarget CR in the same namespace.
                    type: string
                required:
                - name
                type: object
              targetTrackingConfiguration:
                description: TargetTrackingConfiguration configures a TargetTrackingScaling
                  policy.
                properties:
                  disableScaleIn:
                    description: DisableScaleIn prevents the policy from scaling in.
                    type: boolean
                  predefinedMetricType:
                    description: |-
                      PredefinedMetricType is the predefined metric to track, e.g.
                      ECSServiceAverageCPUUtilization or DynamoDBReadCapacityUtilization.
                    type: string
                  resourceLabel:
                    description: ResourceLabel identifies a specific resource for
                      ALBRequestCountPerTarget.
                    type: string
                  scaleInCooldown:
                    description: ScaleInCooldown is the cooldown (seconds) after a
                      scale-in activity.
                    format: int32
                    minimum: 0
                    type: integer
                  scaleOutCooldown:
                    description: ScaleOutCooldown is the cooldown (seconds) after
                      a scale-out activity.
                    format: int32
                    minimum: 0
                    type: integer
                  targetValue:
                    description: TargetValue is the target value for the metric.
                    type: number
                required:
                - predefinedMetricType
                - targetValue
                type: object
            required:
            - policyName
            - policyType
            type: object
          status:
            description: AppScalingPolicyStatus defines the observed state of AppScalingPolicy.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              policyArn:
                description: PolicyARN is the ARN of the scaling policy.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
