                  GrafanaVersion is the Grafana version for the workspace (e.g. "10.4").
                  Defaults to the latest supported version.
                type: string
              permissionType:
                description: |-
                  PermissionType is SERVICE_MANAGED or CUSTOMER_MANAGED. Use
                  CUSTOMER_MANAGED when creating workspaces through the API.
                enum:
                - SERVICE_MANAGED
                - CUSTOMER_MANAGED
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
