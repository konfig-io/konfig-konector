                - name
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply at creation time.
                type: object
              workspaceName:
                description: WorkspaceName is the name of the workspace. It does not
                  have to be unique.
                minLength: 1
                type: string
              workspaceRoleRef:
                description: |-
                  WorkspaceRoleRef references the IAM role that the workspace uses to
                  access AWS data sources and notification channels, either a managed
                  IAMRole CR (name) or a direct role ARN (arn).
                properties:
                  arn:
                    description: |-
                      ARN is a direct AWS IAM role ARN.
                      If set, Name and Namespace are ignored.
                    type: string
                  name:
                    description: Name of an IAMRole CR in the same namespace.
                    type: string
                  namespace:
                    description: Namespace of the IAMRole CR. Defaults to the referring
                      object's namespace.
                    type: string
                type: object
            required:
            - accountAccessType
            - authenticationProviders
            - permissionType
            - workspaceName
            type: object
          status:
            description: GrafanaWorkspaceStatus defines the observed state of GrafanaWorkspace.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
