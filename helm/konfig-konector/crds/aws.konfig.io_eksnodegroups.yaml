---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: eksnodegroups.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: EKSNodeGroup
    listKind: EKSNodeGroupList
    plural: eksnodegroups
    singular: eksnodegroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .spec.nodegroupName
      name: Nodegroup
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EKSNodeGroup is the Schema for managing EKS Managed Node Groups.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EKSNodeGroupSpec defines the desired state of an EKS Managed
              Node Group.
            properties:
              amiType:
                description: AmiType is the AMI type for nodes.
                enum:
                - AL2_x86_64
                - AL2_x86_64_GPU
                - AL2_ARM_64
                - AL2023_x86_64_STANDARD
                - AL2023_ARM_64_STANDARD
                - BOTTLEROCKET_x86_64
                - BOTTLEROCKET_ARM_64
                - CUSTOM
                type: string
              capacityType:
                description: 'CapacityType is the capacity type: ON_DEMAND or SPOT.'
                enum:
                - ON_DEMAND
                - SPOT
                type: string
              clusterName:
                description: ClusterName is the EKS cluster name. Either clusterName
                  or clusterRef must be set.
                type: string
              clusterRef:
                description: ClusterRef references an EKSCluster CR in the same namespace.
                properties:
                  clusterName:
                    description: ClusterName is a direct AWS EKS cluster name, bypassing
                      CR lookup.
                    type: string
                  name:
                    description: Name of an EKSCluster CR in the same namespace.
                    type: string
                type: object
              diskSize:
                description: DiskSize is the root EBS volume size in GiB.
                format: int32
                type: integer
              instanceTypes:
                description: InstanceTypes is the list of EC2 instance types. Defaults
                  to t3.medium.
                items:
                  type: string
                type: array
              labels:
                additionalProperties:
                  type: string
                description: Labels are Kubernetes labels applied to nodes.
                type: object
              launchTemplate:
                description: LaunchTemplate is an optional custom launch template.
                properties:
                  id:
                    description: ID is a direct AWS Launch Template ID.
                    type: string
                  name:
                    description: Name is a LaunchTemplate CR name in the same namespace.
                    type: string
                  version:
                    description: Version is the launch template version. Defaults
                      to $Latest.
                    type: string
                type: object
              nodeRepairConfig:
                description: NodeRepairConfig configures automatic node repair.
                properties:
                  enabled:
                    description: Enabled enables automatic node repair.
                    type: boolean
                required:
                - enabled
                type: object
              nodeRoleArn:
                description: |-
                  NodeRoleArn is the IAM role ARN for the node instances.
                  Either nodeRoleArn or nodeRoleRef must be set.
                type: string
              nodeRoleRef:
                description: NodeRoleRef references an IAMRole CR in the same namespace.
                properties:
                  arn:
                    description: |-
                      ARN is a direct AWS IAM role ARN.
                      If set, Name and Namespace are ignored.
                    type: string
                  name:
                    description: Name of an IAMRole CR in the same namespace.
                    type: string
                  namespace:
                    description: Namespace of the IAMRole CR. Defaults to the referring
                      object's namespace.
                    type: string
                type: object
              nodegroupName:
                description: NodegroupName is the name of the node group. Immutable
                  after creation.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: nodegroupName is immutable
                  rule: self == oldSelf
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              releaseVersion:
                description: ReleaseVersion is the AMI release version. Leave empty
                  for latest.
                type: string
              remoteAccess:
                description: RemoteAccess configures SSH access to nodes.
                properties:
                  ec2SshKey:
                    description: EC2SshKey is the name of the EC2 key pair for SSH
                      access.
                    type: string
                  sourceSecurityGroupRefs:
                    description: SourceSecurityGroupRefs restricts SSH access to these
                      security groups.
                    items:
                      description: SecurityGroupRef references either a managed SecurityGroup
                        CR or a direct Security Group ID.
                      properties:
                        id:
                          description: ID is a direct AWS Security Group ID (e.g.
                            sg-0abc1234).
                          type: string
                        name:
                          description: Name of a SecurityGroup CR in the same namespace.
                          type: string
                      type: object
                    type: array
                type: object
              scalingConfig:
                description: ScalingConfig defines the min/max/desired node counts.
                properties:
                  desiredSize:
                    description: DesiredSize is the desired number of nodes.
                    format: int32
                    minimum: 0
                    type: integer
                  maxSize:
                    description: MaxSize is the maximum number of nodes.
                    format: int32
                    minimum: 1
                    type: integer
                  minSize:
                    description: MinSize is the minimum number of nodes.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - desiredSize
                - maxSize
                - minSize
                type: object
              subnetRefs:
                description: SubnetRefs are the subnets to launch nodes in.
                items:
                  description: SubnetRef references either a managed Subnet CR or
                    a direct Subnet ID.
                  properties:
                    id:
                      description: ID is a direct AWS Subnet ID (e.g. subnet-0abc1234).
                      type: string
                    name:
                      description: Name of a Subnet CR in the same namespace.
                      type: string
                  type: object
                minItems: 1
                type: array
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags.
                type: object
              taints:
                description: Taints are Kubernetes taints applied to nodes.
                items:
                  description: EKSTaint defines a Kubernetes taint applied to EKS
                    nodes.
                  properties:
                    effect:
                      description: Effect specifies the taint effect.
                      enum:
                      - NO_SCHEDULE
                      - NO_EXECUTE
                      - PREFER_NO_SCHEDULE
                      type: string
                    key:
                      description: Key is the taint key.
                      type: string
                    value:
                      description: Value is the taint value.
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
              updateConfig:
                description: UpdateConfig defines rolling update behavior.
                properties:
                  maxUnavailable:
                    description: MaxUnavailable is the maximum number of nodes unavailable
                      during an update.
                    format: int32
                    type: integer
                  maxUnavailablePercentage:
                    description: MaxUnavailablePercentage is the maximum percentage
                      of nodes unavailable during an update.
                    format: int32
                    type: integer
                type: object
              version:
                description: Version is the Kubernetes version for the node group.
                  Defaults to the cluster version.
                type: string
            required:
            - nodegroupName
            - scalingConfig
            - subnetRefs
            type: object
          status:
            description: EKSNodeGroupStatus defines the observed state of EKSNodeGroup.
            properties:
              awsProvider:
                description: AWSProvider confirms the account and region this resource
                  was reconciled against.
                properties:
                  accountId:
                    description: AccountID the resource lives in.
                    type: string
                  name:
                    description: Name of the AWSProvider used; empty when the operator's
                      own credentials were used.
                    type: string
                  region:
                    description: Region the resource lives in (empty for global services).
                    type: string
                type: object
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              nodegroupArn:
                description: NodegroupArn is the ARN of the node group.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              status:
                description: 'Status is the node group status: CREATING, ACTIVE, UPDATING,
                  DELETING, DEGRADED.'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
