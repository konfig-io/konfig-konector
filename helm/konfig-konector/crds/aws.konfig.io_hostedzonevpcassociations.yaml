                    type: string
                required:
                - name
                type: object
              vpcProviderRef:
                description: |-
                  VPCProviderRef names the AWSProvider of the account owning the VPC when
                  it differs from the zone's account.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
