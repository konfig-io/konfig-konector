---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: ecsservices.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: ECSService
    listKind: ECSServiceList
    plural: ecsservices
    singular: ecsservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceName
      name: Service
      type: string
    - jsonPath: .spec.desiredCount
      name: Desired
      type: integer
    - jsonPath: .status.runningCount
      name: Running
      type: integer
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ECSService is the Schema for managing ECS Services.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ECSServiceSpec defines the desired state of an ECS Service.
            properties:
              clusterName:
                description: ClusterName is a direct ECS cluster name or ARN.
                type: string
              clusterRef:
                description: |-
                  ClusterRef references the ECS cluster to run the service in.
                  Either clusterRef or clusterName must be set.
                properties:
                  clusterName:
                    description: ClusterName is a direct AWS ECS cluster name or ARN.
                    type: string
                  name:
                    description: Name of an ECSCluster CR in the same namespace.
                    type: string
                type: object
              desiredCount:
                description: DesiredCount is the number of task instances to run.
                format: int32
                minimum: 0
                type: integer
              enableExecuteCommand:
                description: EnableExecuteCommand enables ECS Exec on tasks.
                type: boolean
              healthCheckGracePeriodSeconds:
                description: HealthCheckGracePeriodSeconds is the grace period before
                  health check starts.
                format: int32
                type: integer
              launchType:
                description: LaunchType is the launch type for tasks.
                enum:
                - FARGATE
                - EC2
                - EXTERNAL
                type: string
              loadBalancers:
                description: LoadBalancers connect the service to ALB/NLB target groups.
                items:
                  description: ECSLoadBalancer configures an ALB/NLB target group
                    for service load balancing.
                  properties:
                    containerName:
                      description: ContainerName is the name of the container to register
                        with the target group.
                      type: string
                    containerPort:
                      description: ContainerPort is the container port to route traffic
                        to.
                      format: int32
                      type: integer
                    targetGroupArn:
                      description: TargetGroupArn is the ARN of the ALB/NLB target
                        group.
                      type: string
                  required:
                  - containerName
                  - containerPort
                  - targetGroupArn
                  type: object
                type: array
              networkConfiguration:
                description: NetworkConfiguration is required for awsvpc network mode
                  tasks.
                properties:
                  assignPublicIp:
                    description: 'AssignPublicIP controls whether tasks get a public
                      IP. Default: DISABLED.'
                    enum:
                    - ENABLED
                    - DISABLED
                    type: string
                  securityGroupRefs:
                    description: SecurityGroupRefs are the security groups to attach
                      to tasks.
                    items:
                      description: SecurityGroupRef references either a managed SecurityGroup
                        CR or a direct Security Group ID.
                      properties:
                        id:
                          description: ID is a direct AWS Security Group ID (e.g.
                            sg-0abc1234).
                          type: string
                        name:
                          description: Name of a SecurityGroup CR in the same namespace.
                          type: string
                      type: object
                    type: array
                  subnetRefs:
                    description: SubnetRefs are the subnets to launch tasks in.
                    items:
                      description: SubnetRef references either a managed Subnet CR
                        or a direct Subnet ID.
                      properties:
                        id:
                          description: ID is a direct AWS Subnet ID (e.g. subnet-0abc1234).
                          type: string
                        name:
                          description: Name of a Subnet CR in the same namespace.
                          type: string
                      type: object
                    type: array
                required:
                - subnetRefs
                type: object
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              serviceName:
                description: ServiceName is the name of the ECS service. Immutable
                  after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: serviceName is immutable
                  rule: self == oldSelf
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags.
                type: object
              taskDefinitionArn:
                description: TaskDefinitionArn is a direct task definition ARN (with
                  revision).
                type: string
              taskDefinitionRef:
                description: |-
                  TaskDefinitionRef references the task definition to run.
                  Either taskDefinitionRef or taskDefinitionArn must be set.
                properties:
                  arn:
                    description: ARN is a direct AWS task definition ARN (e.g. arn:aws:ecs:...:task-definition/my-task:5).
                    type: string
                  name:
                    description: Name of an ECSTaskDefinition CR in the same namespace.
                    type: string
                type: object
            required:
            - desiredCount
            - serviceName
            type: object
          status:
            description: ECSServiceStatus defines the observed state of ECSService.
            properties:
              awsProvider:
                description: AWSProvider confirms the account and region this resource
                  was reconciled against.
                properties:
                  accountId:
                    description: AccountID the resource lives in.
                    type: string
                  name:
                    description: Name of the AWSProvider used; empty when the operator's
                      own credentials were used.
                    type: string
                  region:
                    description: Region the resource lives in (empty for global services).
                    type: string
                type: object
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              pendingCount:
                description: PendingCount is the number of tasks in pending state.
                format: int32
                type: integer
              runningCount:
                description: RunningCount is the number of currently running task
                  instances.
                format: int32
                type: integer
              serviceArn:
                description: ServiceARN is the ARN of the ECS service.
                type: string
              status:
                description: 'Status is the service status: ACTIVE, DRAINING, INACTIVE.'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
