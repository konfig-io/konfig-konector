---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: trails.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: Trail
    listKind: TrailList
    plural: trails
    singular: trail
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.trailArn
      name: Trail-ARN
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Trail is the Schema for managing CloudTrail trails.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TrailSpec defines the desired state of a CloudTrail trail.
            properties:
              cloudWatchLogsLogGroupArn:
                description: |-
                  CloudWatchLogsLogGroupArn is the log group ARN to which CloudTrail logs
                  are delivered. Requires CloudWatchLogsRoleArn.
                type: string
              cloudWatchLogsRoleArn:
                description: |-
                  CloudWatchLogsRoleArn is the role for the CloudWatch Logs endpoint to
                  assume to write to the log group.
                type: string
              enableLogFileValidation:
                description: EnableLogFileValidation enables log file integrity validation.
                type: boolean
              enableLogging:
                default: true
                description: EnableLogging starts (true) or stops (false) recording
                  of API calls.
                type: boolean
              includeGlobalServiceEvents:
                description: IncludeGlobalServiceEvents publishes events from global
                  services such as IAM.
                type: boolean
              isMultiRegionTrail:
                description: IsMultiRegionTrail creates the trail in all Regions.
                type: boolean
              kmsKeyId:
                description: KMSKeyID is the KMS key ID/ARN/alias used to encrypt
                  delivered logs.
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              s3BucketName:
                description: S3BucketName is the S3 bucket designated for publishing
                  log files.
                minLength: 1
                type: string
              s3KeyPrefix:
                description: S3KeyPrefix is the S3 key prefix that follows the bucket
                  name.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply to the trail.
                type: object
              trailName:
                description: TrailName is the name of the trail. Immutable after creation.
                maxLength: 128
                minLength: 3
                type: string
                x-kubernetes-validations:
                - message: trailName is immutable
                  rule: self == oldSelf
            required:
            - s3BucketName
            - trailName
            type: object
          status:
            description: TrailStatus defines the observed state of Trail.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              isLogging:
                description: IsLogging reports whether the trail is currently logging.
                type: boolean
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              trailArn:
                description: TrailARN is the ARN of the trail.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
