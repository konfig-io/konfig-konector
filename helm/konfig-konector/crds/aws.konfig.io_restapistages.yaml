---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: restapistages.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: RestAPIStage
    listKind: RestAPIStageList
    plural: restapistages
    singular: restapistage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.stageName
      name: Stage
      type: string
    - jsonPath: .status.apiId
      name: API-ID
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RestAPIStage is the Schema for managing API Gateway REST API
          stages.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RestAPIStageSpec defines the desired state of a REST API
              stage.
            properties:
              deploymentRef:
                description: DeploymentRef references the RestAPIDeployment the stage
                  points at.
                properties:
                  deploymentId:
                    description: DeploymentID is a direct AWS deployment ID, bypassing
                      CR lookup.
                    type: string
                  name:
                    description: Name of a RestAPIDeployment CR in the same namespace.
                    type: string
                type: object
              description:
                description: Description of the stage.
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              restApiRef:
                description: RestAPIRef references the RestAPI this stage belongs
                  to.
                properties:
                  apiId:
                    description: APIID is a direct AWS API Gateway API ID, bypassing
                      CR lookup.
                    type: string
                  name:
                    description: Name of the API CR in the same namespace.
                    type: string
                type: object
              stageName:
                description: StageName is the name of the stage. Immutable after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: stageName is immutable
                  rule: self == oldSelf
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply on creation.
                type: object
              tracingEnabled:
                description: TracingEnabled enables X-Ray tracing for the stage.
