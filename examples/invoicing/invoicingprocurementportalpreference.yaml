# InvoicingProcurementPortalPreference — invoicing
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/invoicing.html#invoicingprocurementportalpreference
apiVersion: aws.konfig.io/v1alpha1
kind: InvoicingProcurementPortalPreference
metadata:
  name: example-invoicingprocurementportalpreference
  namespace: default
spec:
  buyerDomain: NetworkID
  buyerIdentifier: example
  contacts:
  - email: ops@example.com
    name: example-invoicingprocurementportalpreference
  einvoiceDeliveryEnabled: true
  einvoiceDeliveryPreference:
    connectionTestingMethod: PROD_ENV_DOLLAR_TEST
    einvoiceDeliveryActivationDate: example
    einvoiceDeliveryAttachmentTypes:
    - example
    einvoiceDeliveryDocumentTypes:
    - example
    protocol: CXML
    purchaseOrderDataSources:
    - einvoiceDeliveryDocumentType: AWS_CLOUD_INVOICE
      purchaseOrderDataSourceType: ASSOCIATED_PURCHASE_ORDER_REQUIRED
  procurementPortalInstanceEndpoint: example
  procurementPortalName: SAP_BUSINESS_NETWORK
  procurementPortalSharedSecret: example
  providerRef:
    name: example-invoicingprocurementportalpreference
    region: us-east-1
  purchaseOrderRetrievalEnabled: true
  selector:
    invoiceUnitArns:
    - example
  supplierDomain: NetworkID
  supplierIdentifier: example
  tags:
  - key: example
    value: example
  testEnvPreference:
    buyerDomain: NetworkID
    buyerIdentifier: example
    procurementPortalInstanceEndpoint: example
    procurementPortalSharedSecret: example
    supplierDomain: NetworkID
    supplierIdentifier: example
