apiVersion: aws.konfig.io/v1alpha1
kind: GlueSecurityConfiguration
metadata:
  name: example-gluesecurityconfiguration
  namespace: default
spec:
  encryptionConfiguration:
    cloudWatchEncryption:
      cloudWatchEncryptionMode: example
      kmsKeyArn: arn:aws:iam::123456789012:role/example-role
    jobBookmarksEncryption:
      jobBookmarksEncryptionMode: example
      kmsKeyArn: arn:aws:iam::123456789012:role/example-role
    s3Encryptions:
    - kmsKeyArn: arn:aws:iam::123456789012:role/example-role
      s3EncryptionMode: example
  name: example-gluesecurityconfiguration
  providerRef:
    name: example-gluesecurityconfiguration
    region: us-east-1
