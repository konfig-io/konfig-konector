apiVersion: aws.konfig.io/v1alpha1
kind: GlueMLTransform
metadata:
  name: example-gluemltransform
  namespace: default
spec:
  description: Managed by konfig-konector
  glueVersion: '1.0'
  inputRecordTables:
    glueTables:
    - connectionName: example-gluemltransform
      databaseName: example-gluemltransform
      tableName: example-gluemltransform
  maxCapacity: 2
  maxRetries: 1
  name: example-gluemltransform
  numberOfWorkers: 1
  providerRef:
    name: example-gluemltransform
    region: us-east-1
  role: example
  tags:
    environment: dev
    team: platform
  timeout: 300
  transformEncryption:
    mlUserDataEncryption:
      kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
      mlUserDataEncryptionMode: example
    taskRunSecurityConfigurationName: example-gluemltransform
  transformParameters:
    findMatchesParameters:
      accuracyCostTradeoff: 1
      enforceProvidedLabels: false
      precisionRecallTradeoff: 1
      primaryKeyColumnName: example-gluemltransform
    transformType: example
  workerType: example
