# GlueTableOptimizer — Glue
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/glue.html#gluetableoptimizer
apiVersion: aws.konfig.io/v1alpha1
kind: GlueTableOptimizer
metadata:
  name: example-gluetableoptimizer
  namespace: default
spec:
  catalogId: example-id
  databaseName: example-gluetableoptimizer
  providerRef:
    name: example-gluetableoptimizer
    region: us-east-1
  tableName: example-gluetableoptimizer
  tableOptimizerConfiguration:
    compactionConfiguration:
      icebergConfiguration:
        deleteFileThreshold: 1
        minInputFiles: 1
        strategy: example
    enabled: true
    orphanFileDeletionConfiguration:
      icebergConfiguration:
        location: example
        orphanFileRetentionPeriodInDays: 7
    retentionConfiguration:
      icebergConfiguration:
        cleanExpiredFiles: false
        numberOfSnapshotsToRetain: 1
        snapshotRetentionPeriodInDays: 7
    roleArn: arn:aws:iam::123456789012:role/example-role
    vpcConfiguration:
      glueConnectionName: example-gluetableoptimizer
  type: example
