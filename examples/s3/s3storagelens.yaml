# S3StorageLens — S3
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3.html#s3storagelens
apiVersion: aws.konfig.io/v1alpha1
kind: S3StorageLens
metadata:
  name: example-s3storagelens
  namespace: default
spec:
  providerRef:
    name: example-s3storagelens
    region: us-east-1
  storageLensConfiguration:
    accountLevel:
      activityMetrics:
        isEnabled: true
      advancedCostOptimizationMetrics:
        isEnabled: true
      advancedDataProtectionMetrics:
        isEnabled: true
      advancedPerformanceMetrics:
        isEnabled: true
      detailedStatusCodesMetrics:
        isEnabled: true
    awsOrg:
      name: example-awsorg
    dataExport:
      cloudWatchMetrics:
        isEnabled: true
      s3BucketDestination:
        accountId: '123456789012'
        arn: arn:aws:iam::123456789012:role/example-role
        format: CSV
        outputSchemaVersion: V_1
        prefix: example
      storageLensTableDestination:
        isEnabled: true
    exclude:
      buckets:
      - example
      regions:
      - example
    expandedPrefixesDataExport:
      s3BucketDestination:
        accountId: '123456789012'
        arn: arn:aws:iam::123456789012:role/example-role
        format: CSV
        outputSchemaVersion: V_1
        prefix: example
      storageLensTableDestination:
        isEnabled: true
    id: example-id
    include:
      buckets:
      - example
      regions:
      - example
    isEnabled: true
    prefixDelimiter: example
    storageLensArn: arn:aws:iam::123456789012:role/example-role
  tags:
  - key: example
    value: example
