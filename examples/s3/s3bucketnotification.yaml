# S3BucketNotification — S3
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3.html#s3bucketnotification
apiVersion: aws.konfig.io/v1alpha1
kind: S3BucketNotification
metadata:
  name: example-s3bucketnotification
  namespace: default
spec:
  bucketName: example-s3bucketnotification
  eventBridgeEnabled: true
  lambdaFunctionConfigurations:
  - events:
    - example
    lambdaFunctionArn: arn:aws:iam::123456789012:role/example-role
  queueConfigurations:
  - events:
    - example
    queueArn: arn:aws:iam::123456789012:role/example-role
  topicConfigurations:
  - events:
    - example
    topicArn: arn:aws:iam::123456789012:role/example-role
