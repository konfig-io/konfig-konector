# S3MultiRegionAccessPoint — S3
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3.html#s3multiregionaccesspoint
apiVersion: aws.konfig.io/v1alpha1
kind: S3MultiRegionAccessPoint
metadata:
  name: example-s3multiregionaccesspoint
  namespace: default
spec:
  name: example-s3multiregionaccesspoint
  providerRef:
    name: example-s3multiregionaccesspoint
    region: us-east-1
  publicAccessBlockConfiguration:
    blockPublicAcls: false
    blockPublicPolicy: false
    ignorePublicAcls: false
    restrictPublicBuckets: false
  regions:
  - bucket: example
    bucketAccountId: '123456789012'
