# ConfigRemediationConfiguration — AWS Config
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/configservice.html#configremediationconfiguration
apiVersion: aws.konfig.io/v1alpha1
kind: ConfigRemediationConfiguration
metadata:
  name: example-configremediationconfiguration
  namespace: default
spec:
  automatic: false
  configRuleName: example-configremediationconfiguration
  executionControls:
    ssmControls:
      concurrentExecutionRatePercentage: 1
      errorPercentage: 1
  maximumAutomaticAttempts: 1
  providerRef:
    name: example-configremediationconfiguration
    region: us-east-1
  resourceType: example
  retryAttemptSeconds: 300
  targetId: example-id
  targetType: example
  targetVersion: '1.0'
