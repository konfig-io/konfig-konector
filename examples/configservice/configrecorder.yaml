# ConfigRecorder — AWS Config
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/configservice.html#configrecorder
apiVersion: aws.konfig.io/v1alpha1
kind: ConfigRecorder
metadata:
  name: example-configrecorder
  namespace: default
spec:
  enabled: true
  recorderName: example-configrecorder
  recordingGroup:
    allSupported: false
    includeGlobalResourceTypes: false
    resourceTypes:
    - example
  roleARN: arn:aws:iam::123456789012:role/example-role
  roleRef:
    name: example-role
