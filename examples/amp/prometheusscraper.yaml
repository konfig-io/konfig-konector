# PrometheusScraper — Managed Prometheus
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/amp.html#prometheusscraper
apiVersion: aws.konfig.io/v1alpha1
kind: PrometheusScraper
metadata:
  name: example-prometheusscraper
  namespace: default
spec:
  alias: example
  destination:
    ampConfiguration:
      workspaceArn: arn:aws:iam::123456789012:role/example-role
    cloudWatchConfiguration:
      datasetArn: arn:aws:iam::123456789012:role/example-role
  providerRef:
    name: example-prometheusscraper
    region: us-east-1
  roleConfiguration:
    sourceRoleArn: arn:aws:iam::123456789012:role/example-role
    targetRoleArn: arn:aws:iam::123456789012:role/example-role
  scrapeConfiguration:
    configurationBlob: example
  scraperLoggingConfiguration:
    loggingDestination:
      cloudWatchLogs:
        logGroupArn: arn:aws:iam::123456789012:role/example-role
    scraperComponents:
    - type: SERVICE_DISCOVERY
  source:
    eksConfiguration:
      clusterArn: arn:aws:iam::123456789012:role/example-role
      securityGroupIds:
      - example
      subnetIds:
      - example
    vpcConfiguration:
      securityGroupIds:
      - example
      subnetIds:
      - example
  tags:
  - key: example
    value: example
