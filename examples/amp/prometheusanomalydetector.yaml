# PrometheusAnomalyDetector — Managed Prometheus
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/amp.html#prometheusanomalydetector
apiVersion: aws.konfig.io/v1alpha1
kind: PrometheusAnomalyDetector
metadata:
  name: example-prometheusanomalydetector
  namespace: default
spec:
  alias: example
  configuration:
    randomCutForest:
      ignoreNearExpectedFromAbove:
        amount: 1
        ratio: 1
      ignoreNearExpectedFromBelow:
        amount: 1
        ratio: 1
      query: example
      sampleSize: 256
      shingleSize: 2
  evaluationIntervalInSeconds: 300
  labels:
  - key: example
    value: example
  missingDataAction:
    markAsAnomaly: false
    skip: false
  providerRef:
    name: example-prometheusanomalydetector
    region: us-east-1
  tags:
  - key: example
    value: example
  workspace: example
