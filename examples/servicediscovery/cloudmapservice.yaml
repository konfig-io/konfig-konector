# CloudMapService — Cloud Map
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/servicediscovery.html#cloudmapservice
apiVersion: aws.konfig.io/v1alpha1
kind: CloudMapService
metadata:
  name: example-cloudmapservice
  namespace: default
spec:
  description: Managed by konfig-konector
  dnsConfig:
    recordType: A
    routingPolicy: MULTIVALUE
    ttl: 1
  healthCheckCustomConfig:
    failureThreshold: 1
  name: example-cloudmapservice
  namespaceRef:
    name: example-namespace
  providerRef:
    name: example-cloudmapservice
    region: us-east-1
  tags:
    environment: dev
    team: platform
