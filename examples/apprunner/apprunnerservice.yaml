# AppRunnerService — App Runner
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/apprunner.html#apprunnerservice
apiVersion: aws.konfig.io/v1alpha1
kind: AppRunnerService
metadata:
  name: example-apprunnerservice
  namespace: default
spec:
  healthCheckConfiguration:
    healthyThreshold: 1
    interval: 1
    path: example
    protocol: TCP
    timeout: 1
    unhealthyThreshold: 1
  instanceConfiguration:
    cpu: example
    instanceRoleArn: arn:aws:iam::123456789012:role/example-role
    instanceRoleRef:
      name: example-instancerole
    memory: example
  providerRef:
    name: example-apprunnerservice
    region: us-east-1
  serviceName: example-apprunnerservice
  sourceConfiguration:
    authenticationConfiguration:
      accessRoleArn: arn:aws:iam::123456789012:role/example-role
      accessRoleRef:
        name: example-accessrole
    autoDeploymentsEnabled: true
    imageRepository:
      imageConfiguration:
        port: example
        startCommand: example
      imageIdentifier: example
      imageRepositoryType: ECR
  tags:
    environment: dev
    team: platform
