# S3AccessPoint — S3 Control
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3control.html#s3accesspoint
apiVersion: aws.konfig.io/v1alpha1
kind: S3AccessPoint
metadata:
  name: example-s3accesspoint
  namespace: default
spec:
  accountId: '123456789012'
  bucketRef:
    bucketName: example-s3accesspoint
    name: example-s3accesspoint
  name: example-s3accesspoint
  publicAccessBlock:
    blockPublicAcls: false
    blockPublicPolicy: false
    ignorePublicAcls: false
    restrictPublicBuckets: false
  vpcConfiguration:
    vpcRef:
      name: example-vpc
