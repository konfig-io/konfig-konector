# WAFv2LoggingConfiguration — WAFv2
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/wafv2.html#wafv2loggingconfiguration
apiVersion: aws.konfig.io/v1alpha1
kind: WAFv2LoggingConfiguration
metadata:
  name: example-wafv2loggingconfiguration
  namespace: default
spec:
  logDestinationConfigs:
  - example
  loggingFilter:
    defaultBehavior: KEEP
    filters:
    - behavior: KEEP
      requirement: MEETS_ALL
  providerRef:
    name: example-wafv2loggingconfiguration
    region: us-east-1
  redactedFields:
  - singleHeader:
      name: example-singleheader
  resourceArn: arn:aws:iam::123456789012:role/example-role
