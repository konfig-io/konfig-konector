# GlobalAcceleratorEndpointGroup — globalaccelerator
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/globalaccelerator.html#globalacceleratorendpointgroup
apiVersion: aws.konfig.io/v1alpha1
kind: GlobalAcceleratorEndpointGroup
metadata:
  name: example-globalacceleratorendpointgroup
  namespace: default
spec:
  endpointConfigurations:
  - attachmentArn: arn:aws:iam::123456789012:role/example-role
    clientIPPreservationEnabled: true
    endpointId: example-id
    weight: 1
  endpointGroupRegion: example
  healthCheckIntervalSeconds: 300
  healthCheckPath: example
  healthCheckPort: 1
  healthCheckProtocol: TCP
  listenerArn: arn:aws:iam::123456789012:role/example-role
  portOverrides:
  - endpointPort: 1
    listenerPort: 1
  providerRef:
    name: example-globalacceleratorendpointgroup
    region: us-east-1
  thresholdCount: 2
  trafficDialPercentage: 1
