# BedrockDataSource — bedrock
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/bedrock.html#bedrockdatasource
apiVersion: aws.konfig.io/v1alpha1
kind: BedrockDataSource
metadata:
  name: example-bedrockdatasource
  namespace: default
spec:
  dataDeletionPolicy: RETAIN
  dataSourceConfiguration:
    confluenceConfiguration:
      sourceConfiguration:
        authType: BASIC
        credentialsSecretArn: arn:aws:iam::123456789012:role/example-role
        hostType: SAAS
        hostUrl: example
    managedKnowledgeBaseConnectorConfiguration:
      deletionProtectionConfiguration:
        deletionProtectionStatus: ENABLED
        deletionProtectionThreshold: 1
    s3Configuration:
      bucketArn: arn:aws:iam::123456789012:role/example-role
      bucketOwnerAccountId: '123456789012'
      inclusionPrefixes:
      - example
    salesforceConfiguration:
      sourceConfiguration:
        authType: OAUTH2_CLIENT_CREDENTIALS
        credentialsSecretArn: arn:aws:iam::123456789012:role/example-role
        hostUrl: example
    sharePointConfiguration:
      sourceConfiguration:
        authType: OAUTH2_CLIENT_CREDENTIALS
        credentialsSecretArn: arn:aws:iam::123456789012:role/example-role
        domain: example
        hostType: ONLINE
        siteUrls:
        - example
    type: S3
    webConfiguration:
      crawlerConfiguration:
        exclusionFilters:
        - example
        inclusionFilters:
        - example
        scope: HOST_ONLY
        userAgent: example
        userAgentHeader: example
      sourceConfiguration:
        urlConfiguration:
          seedUrls:
          - url: example
  description: Managed by konfig-konector
  knowledgeBaseId: example-id
  name: example-bedrockdatasource
  providerRef:
    name: example-bedrockdatasource
    region: us-east-1
  serverSideEncryptionConfiguration:
    kmsKeyArn: arn:aws:iam::123456789012:role/example-role
  vectorIngestionConfiguration:
    chunkingConfiguration:
      chunkingStrategy: FIXED_SIZE
      fixedSizeChunkingConfiguration:
        maxTokens: 1
        overlapPercentage: 1
      hierarchicalChunkingConfiguration:
        levelConfigurations:
        - maxTokens: 1
        overlapTokens: 1
      semanticChunkingConfiguration:
        breakpointPercentileThreshold: 50
        bufferSize: 1
        maxTokens: 1
    contextEnrichmentConfiguration:
      bedrockFoundationModelConfiguration:
        enrichmentStrategyConfiguration:
          method: CHUNK_ENTITY_EXTRACTION
        modelArn: arn:aws:iam::123456789012:role/example-role
      type: BEDROCK_FOUNDATION_MODEL
    customTransformationConfiguration:
      intermediateStorage:
        s3Location:
          uri: example
      transformations:
      - stepToApply: POST_CHUNKING
        transformationFunction:
          transformationLambdaConfiguration:
            lambdaArn: arn:aws:iam::123456789012:role/example-role
    parsingConfiguration:
      bedrockDataAutomationConfiguration:
        parsingModality: MULTIMODAL
      bedrockFoundationModelConfiguration:
        modelArn: arn:aws:iam::123456789012:role/example-role
        parsingModality: MULTIMODAL
      parsingStrategy: BEDROCK_FOUNDATION_MODEL
