# BedrockDataAutomationProject — bedrock
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/bedrock.html#bedrockdataautomationproject
apiVersion: aws.konfig.io/v1alpha1
kind: BedrockDataAutomationProject
metadata:
  name: example-bedrockdataautomationproject
  namespace: default
spec:
  customOutputConfiguration:
    blueprints:
    - blueprintArn: arn:aws:iam::123456789012:role/example-role
      blueprintStage: DEVELOPMENT
      blueprintVersion: '1.0'
  kmsEncryptionContext:
    key: value
  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  overrideConfiguration:
    audio:
      languageConfiguration:
        generativeOutputLanguage: DEFAULT
        identifyMultipleLanguages: false
        inputLanguages:
        - example
      modalityProcessing:
        state: ENABLED
      sensitiveDataConfiguration:
        detectionMode: DETECTION
        detectionScope:
        - example
    document:
      modalityProcessing:
        state: ENABLED
      sensitiveDataConfiguration:
        detectionMode: DETECTION
        detectionScope:
        - example
      splitter:
        state: ENABLED
    image:
      modalityProcessing:
        state: ENABLED
      sensitiveDataConfiguration:
        detectionMode: DETECTION
        detectionScope:
        - example
    modalityRouting:
      jpeg: DOCUMENT
      mov: DOCUMENT
      mp4: DOCUMENT
      png: DOCUMENT
    video:
      modalityProcessing:
        state: ENABLED
      sensitiveDataConfiguration:
        detectionMode: DETECTION
        detectionScope:
        - example
  projectDescription: Managed by konfig-konector
  projectName: example-bedrockdataautomationproject
  projectType: ASYNC
  providerRef:
    name: example-bedrockdataautomationproject
    region: us-east-1
  standardOutputConfiguration:
    audio:
      extraction:
        category:
          state: ENABLED
          types:
          - example
      generativeField:
        state: ENABLED
        types:
        - example
    document:
      extraction:
        boundingBox:
          state: ENABLED
        granularity:
          types:
          - example
      generativeField:
        state: ENABLED
      outputFormat:
        additionalFileFormat:
          state: ENABLED
        textFormat:
          types:
          - example
    image:
      extraction:
        boundingBox:
          state: ENABLED
        category:
          state: ENABLED
          types:
          - example
      generativeField:
        state: ENABLED
        types:
        - example
    video:
      extraction:
        boundingBox:
          state: ENABLED
        category:
          state: ENABLED
          types:
          - example
      generativeField:
        state: ENABLED
        types:
        - example
  tags:
  - key: example
    value: example
