# BedrockAgent — Bedrock
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/bedrock.html#bedrockagent
apiVersion: aws.konfig.io/v1alpha1
kind: BedrockAgent
metadata:
  name: example-bedrockagent
  namespace: default
spec:
  actionGroups:
  - actionGroupName: example-bedrockagent
    actionGroupState: ENABLED
    description: Managed by konfig-konector
    functionSchema:
      functions:
      - description: Managed by konfig-konector
        name: example-bedrockagent
        requireConfirmation: ENABLED
    parentActionGroupSignature: AMAZON.UserInput
    skipResourceInUseCheckOnDelete: false
  agentCollaboration: DISABLED
  agentCollaborators:
  - agentDescriptor:
      aliasArn: arn:aws:iam::123456789012:role/example-role
    collaborationInstruction: example
    collaboratorName: example-bedrockagent
    relayConversationHistory: TO_COLLABORATOR
  agentName: example-bedrockagent
  agentResourceRoleArn: arn:aws:iam::123456789012:role/example-role
  autoPrepare: false
  customOrchestration:
    executor:
      lambda: example
  customerEncryptionKeyArn: arn:aws:iam::123456789012:role/example-role
  description: Managed by konfig-konector
  foundationModel: example
  guardrailConfiguration:
    guardrailIdentifier: example
    guardrailVersion: '1.0'
  idleSessionTTLInSeconds: 300
  instruction: example
  knowledgeBases:
  - description: Managed by konfig-konector
    knowledgeBaseId: example-id
    knowledgeBaseState: ENABLED
  memoryConfiguration:
    enabledMemoryTypes:
    - example
    sessionSummaryConfiguration:
      maxRecentSessions: 1
    storageDays: 7
  orchestrationType: DEFAULT
  promptOverrideConfiguration:
    overrideLambda: example
    promptConfigurations:
    - basePromptTemplate: example
      foundationModel: example
      parserMode: DEFAULT
      promptCreationMode: DEFAULT
      promptState: ENABLED
      promptType: PRE_PROCESSING
  providerRef:
    name: example-bedrockagent
    region: us-east-1
  skipResourceInUseCheckOnDelete: false
  tags:
    environment: dev
    team: platform
  testAliasTags:
    environment: dev
    team: platform
