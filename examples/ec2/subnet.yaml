# Subnet — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#subnet
apiVersion: aws.konfig.io/v1alpha1
kind: Subnet
metadata:
  name: example-subnet
  namespace: default
spec:
  availabilityZone: us-east-1a
  cidrBlock: 10.0.0.0/16
  mapPublicIpOnLaunch: false
  providerRef:
    name: example-subnet
    region: us-east-1
  tags:
    environment: dev
    team: platform
  vpcRef:
    name: example-vpc
