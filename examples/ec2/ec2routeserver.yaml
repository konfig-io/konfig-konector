apiVersion: aws.konfig.io/v1alpha1
kind: EC2RouteServer
metadata:
  name: example-ec2routeserver
  namespace: default
spec:
  amazonSideAsn: 1
  persistRoutes: enable
  persistRoutesDuration: 1
  providerRef:
    name: example-ec2routeserver
    region: us-east-1
  snsNotificationsEnabled: true
  tags:
  - key: example
    value: example
