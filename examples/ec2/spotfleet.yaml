# SpotFleet — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#spotfleet
apiVersion: aws.konfig.io/v1alpha1
kind: SpotFleet
metadata:
  name: example-spotfleet
  namespace: default
spec:
  allocationStrategy: lowestPrice
  iamFleetRole: example
  launchSpecs:
  - imageId: ami-0abc1234def567890
    instanceType: example
    keyName: example-spotfleet
    securityGroupIds:
    - example
    spotPrice: example
    weightedCapacity: 2
  spotPrice: example
  tags:
    environment: dev
    team: platform
  targetCapacity: 1
  terminateInstancesWithExpiration: false
  validUntil: '2026-01-01T00:00:00Z'
