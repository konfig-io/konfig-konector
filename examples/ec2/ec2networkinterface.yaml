    tcpEstablishedTimeout: 300
    udpStreamTimeout: 300
    udpTimeout: 300
  description: Managed by konfig-konector
  enablePrimaryIpv6: true
  groupSet:
  - example
  interfaceType: example
  ipv4PrefixCount: 2
  ipv4Prefixes:
  - ipv4Prefix: example
  ipv6AddressCount: 2
  ipv6Addresses:
  - ipv6Address: example
  ipv6PrefixCount: 2
  ipv6Prefixes:
  - ipv6Prefix: example
  privateIpAddress: example
  privateIpAddresses:
  - primary: false
    privateIpAddress: example
  providerRef:
    name: example-ec2networkinterface
    region: us-east-1
  publicIpDnsHostnameTypeSpecification: public-dual-stack-dns-name
  secondaryPrivateIpAddressCount: 2
  sourceDestCheck: false
  subnetId: subnet-0abc12def3456789
  tags:
  - key: example
    value: example
