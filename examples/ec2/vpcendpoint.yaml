apiVersion: aws.konfig.io/v1alpha1
kind: VPCEndpoint
metadata:
  name: example-vpcendpoint
  namespace: default
spec:
  endpointType: Interface
  providerRef:
    name: example-vpcendpoint
    region: us-east-1
  routeTableRefs:
  - example
  securityGroupRefs:
  - name: example-securitygrouprefs
  serviceName: example-vpcendpoint
  subnetRefs:
  - name: example-subnetrefs
  tags:
    environment: dev
    team: platform
  vpcRef:
    name: example-vpc
