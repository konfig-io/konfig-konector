# VPC — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#vpc
apiVersion: aws.konfig.io/v1alpha1
kind: VPC
metadata:
  name: example-vpc
  namespace: default
spec:
  assignIpv6CidrBlock: false
  cidrBlock: 10.0.0.0/16
  enableDnsHostnames: true
  enableDnsSupport: true
  instanceTenancy: default
  providerRef:
    name: example-vpc
    region: us-east-1
  secondaryIPv4CIDRs:
  - 10.0.0.0/16
  tags:
    environment: dev
    team: platform
