# SecurityGroup — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#securitygroup
apiVersion: aws.konfig.io/v1alpha1
kind: SecurityGroup
metadata:
  name: example-securitygroup
  namespace: default
spec:
  description: Managed by konfig-konector
  egressRules:
  - cidrIpv4: 10.0.0.0/16
    cidrIpv6: 10.0.0.0/16
    description: Managed by konfig-konector
    fromPort: 443
    protocol: example
    sourceGroupRef: example
    toPort: 443
  groupName: example-securitygroup
  ingressRules:
  - cidrIpv4: 10.0.0.0/16
    cidrIpv6: 10.0.0.0/16
    description: Managed by konfig-konector
    fromPort: 443
    protocol: example
    sourceGroupRef: example
    toPort: 443
  providerRef:
    name: example-securitygroup
    region: us-east-1
  tags:
    environment: dev
    team: platform
  vpcRef:
    name: example-vpc
