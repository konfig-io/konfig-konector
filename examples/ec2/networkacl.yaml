# NetworkACL — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#networkacl
apiVersion: aws.konfig.io/v1alpha1
kind: NetworkACL
metadata:
  name: example-networkacl
  namespace: default
spec:
  entries:
  - cidrBlock: 10.0.0.0/16
    egress: false
    icmpTypeCode:
      code: 1
      type: 1
    ipv6CidrBlock: 2001:db8::/56
    portRange:
      from: 1
      to: 1
    protocol: example
    ruleAction: allow
    ruleNumber: 1
  tags:
    environment: dev
    team: platform
  vpcRef:
    name: example-vpc
