# VPNConnection — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#vpnconnection
apiVersion: aws.konfig.io/v1alpha1
kind: VPNConnection
metadata:
  name: example-vpnconnection
  namespace: default
spec:
  customerGatewayRef:
    name: example-customergateway
  providerRef:
    name: example-vpnconnection
    region: us-east-1
  staticRoutesOnly: false
  tags:
    environment: dev
    team: platform
  transitGatewayRef:
    name: example-vpnconnection
  tunnelOptions:
  - insideCidr: 10.0.0.0/16
    presharedKeyRef:
      key: example
      name: example-vpnconnection
  type: ipsec.1
  vpnGatewayRef:
    name: example-vpngateway
