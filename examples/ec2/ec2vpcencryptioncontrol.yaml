# EC2VPCEncryptionControl — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#ec2vpcencryptioncontrol
apiVersion: aws.konfig.io/v1alpha1
kind: EC2VPCEncryptionControl
metadata:
  name: example-ec2vpcencryptioncontrol
  namespace: default
spec:
  egressOnlyInternetGatewayExclusionInput: enable
  elasticFileSystemExclusionInput: enable
  internetGatewayExclusionInput: enable
  lambdaExclusionInput: enable
  mode: monitor
  natGatewayExclusionInput: enable
  providerRef:
    name: example-ec2vpcencryptioncontrol
    region: us-east-1
  tags:
  - key: example
    value: example
  virtualPrivateGatewayExclusionInput: enable
  vpcLatticeExclusionInput: enable
  vpcPeeringExclusionInput: enable
