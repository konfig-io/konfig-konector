# FlowLog — EC2 & VPC
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ec2.html#flowlog
apiVersion: aws.konfig.io/v1alpha1
kind: FlowLog
metadata:
  name: example-flowlog
  namespace: default
spec:
  deliverLogsPermissionArn: arn:aws:iam::123456789012:role/example-role
  logDestination: example
  logDestinationType: cloud-watch-logs
  logFormat: example
  logGroupName: example-flowlog
  maxAggregationInterval: 1
  providerRef:
    name: example-flowlog
    region: us-east-1
  resourceId: example-id
  resourceType: VPC
  tags:
    environment: dev
    team: platform
  trafficType: ACCEPT
