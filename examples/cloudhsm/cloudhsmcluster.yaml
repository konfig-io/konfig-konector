# CloudHSMCluster — CloudHSM
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudhsm.html#cloudhsmcluster
apiVersion: aws.konfig.io/v1alpha1
kind: CloudHSMCluster
metadata:
  name: example-cloudhsmcluster
  namespace: default
spec:
  backupRetentionPolicy:
    type: DAYS
    value: exa
  hsmType: example
  mode: FIPS
  networkType: IPV4
  providerRef:
    name: example-cloudhsmcluster
    region: us-east-1
  subnetIds:
  - example
  tags:
  - key: example
    value: example
