apiVersion: aws.konfig.io/v1alpha1
kind: AutoScalingGroup
metadata:
  name: example-autoscalinggroup
  namespace: default
spec:
  autoScalingGroupName: example-autoscalinggroup
  desiredCapacity: 2
  launchTemplateRef:
    name: example-autoscalinggroup
    version: '1.0'
  maxSize: 1
  minSize: 1
  tags:
    environment: dev
    team: platform
  targetGroupArns:
  - example
  vpcZoneIdentifier:
  - name: example-vpczoneidentifier
