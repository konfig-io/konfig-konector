# AutoScalingWarmPool — Auto Scaling
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/autoscaling.html#autoscalingwarmpool
apiVersion: aws.konfig.io/v1alpha1
kind: AutoScalingWarmPool
metadata:
  name: example-autoscalingwarmpool
  namespace: default
spec:
  autoScalingGroupName: example-autoscalingwarmpool
  instanceReusePolicy:
    reuseOnScaleIn: false
  maxGroupPreparedCapacity: 2
  minSize: 2
  poolState: example
  providerRef:
    name: example-autoscalingwarmpool
    region: us-east-1
