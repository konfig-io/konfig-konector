# ScalingPolicy — Auto Scaling
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/autoscaling.html#scalingpolicy
apiVersion: aws.konfig.io/v1alpha1
kind: ScalingPolicy
metadata:
  name: example-scalingpolicy
  namespace: default
spec:
  adjustmentType: ChangeInCapacity
  autoScalingGroupRef:
    name: example-autoscalinggroup
  cooldown: 1
  policyName: example-scalingpolicy
  policyType: SimpleScaling
  providerRef:
    name: example-scalingpolicy
    region: us-east-1
  scalingAdjustment: 1
  stepAdjustments:
  - metricIntervalLowerBound: 1
    metricIntervalUpperBound: 1
    scalingAdjustment: 1
  targetTrackingConfiguration:
    disableScaleIn: false
    predefinedMetricType: example
    targetValue: 1
