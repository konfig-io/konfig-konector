    value: example
  openIdConnectProviderARNs:
  - example
  providerRef:
    name: example-cognitoidentitypool
    region: us-east-1
  pushSync:
    applicationArns:
    - example
    roleArn: arn:aws:iam::123456789012:role/example-role
  samlProviderARNs:
  - example
