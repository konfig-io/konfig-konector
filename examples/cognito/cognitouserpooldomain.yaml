# CognitoUserPoolDomain — Cognito
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cognito.html#cognitouserpooldomain
apiVersion: aws.konfig.io/v1alpha1
kind: CognitoUserPoolDomain
metadata:
  name: example-cognitouserpooldomain
  namespace: default
spec:
  customDomainConfig:
    certificateArn: arn:aws:iam::123456789012:role/example-role
    securityPolicy: example
  domain: example
  managedLoginVersion: 1
  providerRef:
    name: example-cognitouserpooldomain
    region: us-east-1
  routing:
    failover:
      primaryRoute53HealthCheckId: example-id
      secondaryRegion: example
  userPoolId: example-id
