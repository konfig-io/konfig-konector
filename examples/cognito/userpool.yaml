# UserPool — Cognito
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cognito.html#userpool
apiVersion: aws.konfig.io/v1alpha1
kind: UserPool
metadata:
  name: example-userpool
  namespace: default
spec:
  autoVerifiedAttributes:
  - example
  mfaConfiguration: 'OFF'
  passwordPolicy:
    minimumLength: 6
    requireLowercase: false
    requireNumbers: false
    requireSymbols: false
    requireUppercase: false
  poolName: example-userpool
  tags:
    environment: dev
    team: platform
