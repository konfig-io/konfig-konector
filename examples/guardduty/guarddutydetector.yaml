# GuardDutyDetector — GuardDuty
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/guardduty.html#guarddutydetector
apiVersion: aws.konfig.io/v1alpha1
kind: GuardDutyDetector
metadata:
  name: example-guarddutydetector
  namespace: default
spec:
  enable: true
  features:
  - name: example-guarddutydetector
    status: ENABLED
  findingPublishingFrequency: FIFTEEN_MINUTES
  providerRef:
    name: example-guarddutydetector
    region: us-east-1
  tags:
    environment: dev
    team: platform
