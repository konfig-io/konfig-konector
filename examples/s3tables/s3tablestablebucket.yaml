# S3TablesTableBucket — S3 Tables
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3tables.html#s3tablestablebucket
apiVersion: aws.konfig.io/v1alpha1
kind: S3TablesTableBucket
metadata:
  name: example-s3tablestablebucket
  namespace: default
spec:
  encryptionConfiguration:
    kmsKeyArn: arn:aws:iam::123456789012:role/example-role
    sseAlgorithm: example
  metricsConfiguration:
    status: Enabled
  providerRef:
    name: example-s3tablestablebucket
    region: us-east-1
  replicationConfiguration:
    role: example
    rules:
    - destinations:
      - destinationTableBucketARN: arn:aws:iam::123456789012:role/example-role
  storageClassConfiguration:
    storageClass: STANDARD
  tableBucketName: example-s3tablestablebucket
  tags:
  - key: example
    value: example
  unreferencedFileRemoval:
    noncurrentDays: 1
    status: Enabled
    unreferencedDays: 1
