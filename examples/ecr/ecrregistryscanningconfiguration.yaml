apiVersion: aws.konfig.io/v1alpha1
kind: ECRRegistryScanningConfiguration
metadata:
  name: example-ecrregistryscanningconfiguration
  namespace: default
spec:
  providerRef:
    name: example-ecrregistryscanningconfiguration
    region: us-east-1
  rules:
