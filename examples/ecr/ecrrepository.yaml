# ECRRepository — ECR
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ecr.html#ecrrepository
apiVersion: aws.konfig.io/v1alpha1
kind: ECRRepository
metadata:
  name: example-ecrrepository
  namespace: default
spec:
  encryptionType: AES256
  imageTagMutability: MUTABLE
  kmsKeyArn: arn:aws:iam::123456789012:role/example-role
  repositoryName: example-ecrrepository
  scanOnPush: false
  tags:
    environment: dev
    team: platform
