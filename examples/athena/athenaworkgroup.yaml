apiVersion: aws.konfig.io/v1alpha1
kind: AthenaWorkGroup
metadata:
  name: example-athenaworkgroup
  namespace: default
spec:
  bytesScannedCutoffPerQuery: 10000000
  description: Managed by konfig-konector
  enforceWorkGroupConfiguration: false
  name: example-athenaworkgroup
  publishCloudWatchMetricsEnabled: true
  resultConfiguration:
    encryptionConfiguration:
      encryptionOption: SSE_S3
      kmsKey: example
    outputLocation: example
  tags:
    environment: dev
    team: platform
