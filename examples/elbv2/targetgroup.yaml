# TargetGroup — Elastic Load Balancing
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/elbv2.html#targetgroup
apiVersion: aws.konfig.io/v1alpha1
kind: TargetGroup
metadata:
  name: example-targetgroup
  namespace: default
spec:
  healthCheck:
    healthyThreshold: 2
    intervalSeconds: 5
    path: example
    port: example
    protocol: HTTP
    unhealthyThreshold: 2
  name: example-targetgroup
  port: 1
  protocol: HTTP
  providerRef:
    name: example-targetgroup
    region: us-east-1
  tags:
    environment: dev
    team: platform
  targetType: instance
  vpcRef:
    name: example-vpc
