# LoadBalancer — Load Balancing
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/elbv2.html#loadbalancer
apiVersion: aws.konfig.io/v1alpha1
kind: LoadBalancer
metadata:
  name: example-loadbalancer
  namespace: default
spec:
  deletionProtection: true
  idleTimeout: 300
  name: example-loadbalancer
  scheme: internet-facing
  securityGroupRefs:
  - name: example-securitygrouprefs
  subnetRefs:
  - name: example-subnetrefs
  - name: example-subnetrefs
  tags:
    environment: dev
    team: platform
  type: application
