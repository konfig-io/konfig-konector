# NetworkFirewallLoggingConfiguration — Network Firewall
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/networkfirewall.html#networkfirewallloggingconfiguration
apiVersion: aws.konfig.io/v1alpha1
kind: NetworkFirewallLoggingConfiguration
metadata:
  name: example-networkfirewallloggingconfiguration
  namespace: default
spec:
  enableMonitoringDashboard: true
  firewallArn: arn:aws:iam::123456789012:role/example-role
  firewallName: example-networkfirewallloggingconfiguration
  loggingConfiguration:
    logDestinationConfigs:
    - logDestination:
        key: value
      logDestinationType: S3
      logType: ALERT
  providerRef:
    name: example-networkfirewallloggingconfiguration
    region: us-east-1
