# GrafanaWorkspace — Managed Grafana
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/grafana.html#grafanaworkspace
apiVersion: aws.konfig.io/v1alpha1
kind: GrafanaWorkspace
metadata:
  name: example-grafanaworkspace
  namespace: default
spec:
  accountAccessType: CURRENT_ACCOUNT
  authenticationProviders:
  - example
  dataSources:
  - example
  grafanaVersion: '1.0'
  permissionType: SERVICE_MANAGED
  tags:
    environment: dev
    team: platform
  workspaceName: example-grafanaworkspace
  workspaceRoleRef:
    name: example-workspacerole
