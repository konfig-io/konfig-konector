apiVersion: aws.konfig.io/v1alpha1
kind: AppConfigEnvironment
metadata:
  name: example-appconfigenvironment
  namespace: default
spec:
  applicationId: example-id
  deletionProtectionCheck: ACCOUNT_DEFAULT
  description: Managed by konfig-konector
  monitors:
