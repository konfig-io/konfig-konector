# DynamoDBTablePolicy — DynamoDB
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/dynamodb.html#dynamodbtablepolicy
apiVersion: aws.konfig.io/v1alpha1
kind: DynamoDBTablePolicy
metadata:
  name: example-dynamodbtablepolicy
  namespace: default
spec:
  policyDocument: '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["s3:GetObject"],
    "Resource": "*"}]}'
  resourceARN: arn:aws:iam::123456789012:role/example-role
