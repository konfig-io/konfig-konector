# DynamoDBTable — DynamoDB
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/dynamodb.html#dynamodbtable
apiVersion: aws.konfig.io/v1alpha1
kind: DynamoDBTable
metadata:
  name: example-dynamodbtable
  namespace: default
spec:
  attributeDefinitions:
  - attributeName: example-dynamodbtable
    attributeType: S
  billingMode: PROVISIONED
  keySchema:
  - attributeName: example-dynamodbtable
    keyType: HASH
  kmsKeyArn: arn:aws:iam::123456789012:role/example-role
  pointInTimeRecovery: false
  provisionedThroughput:
    readCapacityUnits: 1
    writeCapacityUnits: 1
  sseEnabled: true
  tableName: example-dynamodbtable
  tags:
    environment: dev
    team: platform
