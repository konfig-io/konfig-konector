apiVersion: aws.konfig.io/v1alpha1
kind: APIGatewayV2DomainName
metadata:
  name: example-apigatewayv2domainname
  namespace: default
spec:
  certificateArn: arn:aws:iam::123456789012:role/example-role
  domainName: example-apigatewayv2domainname
  endpointType: REGIONAL
  providerRef:
    name: example-apigatewayv2domainname
    region: us-east-1
  securityPolicy: TLS_1_0
  tags:
    environment: dev
    team: platform
