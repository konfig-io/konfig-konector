# ApiGatewayV2RoutingRule — API Gateway v2
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/apigatewayv2.html#apigatewayv2routingrule
apiVersion: aws.konfig.io/v1alpha1
kind: ApiGatewayV2RoutingRule
metadata:
  name: example-apigatewayv2routingrule
  namespace: default
spec:
  actions:
  - invokeApi:
      apiId: example-id
      stage: example
      stripBasePath: false
  conditions:
  - matchBasePaths:
      anyOf:
      - example
    matchHeaders:
      anyOf:
      - header: example
        valueGlob: example
  domainNameArn: arn:aws:iam::123456789012:role/example-role
  priority: 1
  providerRef:
    name: example-apigatewayv2routingrule
    region: us-east-1
