# APIGatewayV2Authorizer — API Gateway v2
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/apigatewayv2.html#apigatewayv2authorizer
apiVersion: aws.konfig.io/v1alpha1
kind: APIGatewayV2Authorizer
metadata:
  name: example-apigatewayv2authorizer
  namespace: default
spec:
  apiRef:
    name: example-apigatewayv2authorizer
  authorizerCredentialsArn: arn:aws:iam::123456789012:role/example-role
  authorizerPayloadFormatVersion: '1.0'
  authorizerResultTtlInSeconds: 1
  authorizerType: JWT
  authorizerUri: example
  enableSimpleResponses: true
  functionRef:
    functionName: example-apigatewayv2authorizer
    name: example-apigatewayv2authorizer
  identitySource:
  - example
  jwtConfiguration:
    audience:
    - example
    issuer: example
  name: example-apigatewayv2authorizer
