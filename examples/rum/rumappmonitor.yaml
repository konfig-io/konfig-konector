apiVersion: aws.konfig.io/v1alpha1
kind: RUMAppMonitor
metadata:
  name: example-rumappmonitor
  namespace: default
spec:
  appMonitorConfiguration:
    allowCookies: false
    enableXRay: true
    excludedPages:
    - example
    favoritePages:
    - example
    guestRoleArn: arn:aws:iam::123456789012:role/example-role
    includedPages:
    - example
