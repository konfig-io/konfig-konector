      iamRoleArn: arn:aws:iam::123456789012:role/example-role
      metricDefinitions:
      - eventPattern: example
        name: example-rumappmonitor
        namespace: example
        unitLabel: example
        valueKey: example
    sessionSampleRate: 1
    telemetries:
    - example
  customEvents:
    status: ENABLED
  cwLogEnabled: true
  deobfuscationConfiguration:
    javaScriptSourceMaps:
      s3Uri: example
      status: ENABLED
  domain: example
  domainList:
  - example
  name: example-rumappmonitor
  platform: Web
  providerRef:
    name: example-rumappmonitor
    region: us-east-1
  resourcePolicy:
    policyDocument: '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["s3:GetObject"],
      "Resource": "*"}]}'
  tags:
  - key: example
