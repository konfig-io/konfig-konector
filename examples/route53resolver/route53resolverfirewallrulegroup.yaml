# Route53ResolverFirewallRuleGroup — Route 53 Resolver
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/route53resolver.html#route53resolverfirewallrulegroup
apiVersion: aws.konfig.io/v1alpha1
kind: Route53ResolverFirewallRuleGroup
metadata:
  name: example-route53resolverfirewallrulegroup
  namespace: default
spec:
  firewallRules:
  - action: ALLOW
    blockOverrideDnsType: CNAME
    blockOverrideDomain: example
    blockOverrideTtl: 1
    blockResponse: NODATA
    confidenceThreshold: LOW
    dnsThreatProtection: DGA
    firewallDomainRedirectionAction: INSPECT_REDIRECTION_DOMAIN
    priority: 1
    qtype: example
    status: COMPLETE
  name: example-route53resolverfirewallrulegroup
  providerRef:
    name: example-route53resolverfirewallrulegroup
    region: us-east-1
  tags:
  - key: example
    value: example
