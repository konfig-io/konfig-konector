# MSKReplicator — MSK
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/kafka.html#mskreplicator
apiVersion: aws.konfig.io/v1alpha1
kind: MSKReplicator
metadata:
  name: example-mskreplicator
  namespace: default
spec:
  description: Managed by konfig-konector
  kafkaClusters:
  - amazonMskCluster:
      mskClusterArn: arn:aws:iam::123456789012:role/example-role
    apacheKafkaCluster:
      apacheKafkaClusterId: example-id
      bootstrapBrokerString: example
    encryptionInTransit:
      encryptionType: TLS
      rootCaCertificate: example
    vpcConfig:
      securityGroupIds:
      - example
      subnetIds:
      - example
  logDelivery:
    replicatorLogDelivery:
      cloudWatchLogs:
        enabled: true
        logGroup: example
      firehose:
        deliveryStream: example
        enabled: true
      s3:
        bucket: example
        enabled: true
        prefix: example
  providerRef:
    name: example-mskreplicator
    region: us-east-1
  replicationInfoList:
  - consumerGroupReplication:
      consumerGroupOffsetSyncMode: LEGACY
      consumerGroupsToExclude:
      - example
      consumerGroupsToReplicate:
      - example
      detectAndCopyNewConsumerGroups: false
      synchroniseConsumerGroupOffsets: false
    sourceKafkaClusterArn: arn:aws:iam::123456789012:role/example-role
    targetCompressionType: NONE
    targetKafkaClusterArn: arn:aws:iam::123456789012:role/example-role
    topicReplication:
      copyAccessControlListsForTopics: false
      copyTopicConfigurations: false
      detectAndCopyNewTopics: false
      topicsToExclude:
      - example
      topicsToReplicate:
      - example
  replicatorName: example-mskreplicator
  serviceExecutionRoleArn: arn:aws:iam::123456789012:role/example-role
  tags:
  - key: example
    value: example
