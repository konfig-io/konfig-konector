# TransferConnector — Transfer Family
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/transfer.html#transferconnector
apiVersion: aws.konfig.io/v1alpha1
kind: TransferConnector
metadata:
  name: example-transferconnector
  namespace: default
spec:
  accessRole: example-xxxxxxxxxxxx
  as2Config:
    asyncMdnConfig:
      serverIds:
      - example
      url: example
    compression: ZLIB
    encryptionAlgorithm: AES128_CBC
    mdnResponse: SYNC
    mdnSigningAlgorithm: SHA256
    messageSubject: example
    preserveContentType: ENABLED
    signingAlgorithm: SHA256
  egressConfig:
    vpcLattice:
      portNumber: 1
      resourceConfigurationArn: arn:aws:iam::123456789012:role/example-role
  egressType: SERVICE_MANAGED
  ipAddressType: IPV4
  loggingRole: example
  providerRef:
    name: example-transferconnector
    region: us-east-1
  securityPolicyName: example-transferconnector
  sftpConfig:
    maxConcurrentConnections: 1
    trustedHostKeys:
    - example
  tags:
  - key: example
    value: example
  url: example
