# EKSCluster — EKS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/eks.html#ekscluster
apiVersion: aws.konfig.io/v1alpha1
kind: EKSCluster
metadata:
  name: example-ekscluster
  namespace: default
spec:
  accessConfig:
    authenticationMode: API
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  clusterName: example-ekscluster
  encryptionConfig:
    providerKeyArn: arn:aws:iam::123456789012:role/example-role
    resources:
    - example
  kubernetesNetworkConfig:
    ipFamily: ipv4
    serviceIpv4Cidr: 10.0.0.0/16
  logging:
    enabledTypes:
    - example
  resourcesVpcConfig:
    endpointPrivateAccess: false
    endpointPublicAccess: false
    publicAccessCidrs:
    - 10.0.0.0/16
    securityGroupRefs:
    - name: example-securitygrouprefs
    subnetRefs:
    - name: example-subnetrefs
  roleArn: arn:aws:iam::123456789012:role/example-role
  roleRef:
    name: example-role
  tags:
    environment: dev
    team: platform
  upgradePolicy:
    supportType: STANDARD
  version: '1.0'
