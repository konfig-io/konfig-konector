# EKSNodeGroup — EKS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/eks.html#eksnodegroup
apiVersion: aws.konfig.io/v1alpha1
kind: EKSNodeGroup
metadata:
  name: example-eksnodegroup
  namespace: default
spec:
  amiType: AL2_x86_64
  capacityType: ON_DEMAND
  clusterName: example-eksnodegroup
  clusterRef:
    clusterName: example-eksnodegroup
    name: example-eksnodegroup
  diskSize: 2
  instanceTypes:
  - example
  labels:
    key: value
  launchTemplate:
    name: example-eksnodegroup
    version: '1.0'
  nodeRepairConfig:
    enabled: true
  nodeRoleArn: arn:aws:iam::123456789012:role/example-role
  nodeRoleRef:
    name: example-noderole
  nodegroupName: example-eksnodegroup
  providerRef:
    name: example-eksnodegroup
    region: us-east-1
  releaseVersion: '1.0'
  remoteAccess:
    ec2SshKey: example
    sourceSecurityGroupRefs:
    - name: example-sourcesecuritygrouprefs
  scalingConfig:
    desiredSize: 1
    maxSize: 1
    minSize: 1
  subnetRefs:
  - name: example-subnetrefs
  tags:
    environment: dev
    team: platform
  taints:
  - effect: NO_SCHEDULE
    key: example
    value: example
  updateConfig:
    maxUnavailable: 1
    maxUnavailablePercentage: 1
  version: '1.0'
