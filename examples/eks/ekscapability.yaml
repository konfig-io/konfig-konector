# EKSCapability — EKS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/eks.html#ekscapability
apiVersion: aws.konfig.io/v1alpha1
kind: EKSCapability
metadata:
  name: example-ekscapability
  namespace: default
spec:
  capabilityName: example-ekscapability
  clusterName: example-ekscapability
  configuration:
    ack:
      disabledServices:
      - example
      enableCrossNamespace: true
    argoCd:
      awsIdc:
        idcInstanceArn: arn:aws:iam::123456789012:role/example-role
        idcManagedApplicationArn: arn:aws:iam::123456789012:role/example-role
        idcRegion: example
      namespace: example
      networkAccess:
        vpceIds:
        - example
      rbacRoleMappings:
      - identities:
        - id: example-id
          type: SSO_USER
        role: ADMIN
      serverUrl: example
  deletePropagationPolicy: RETAIN
  providerRef:
    name: example-ekscapability
    region: us-east-1
  roleArn: arn:aws:iam::123456789012:role/example-role
  tags:
  - key: example
    value: example
  type: ARGOCD
