# MQBroker — Amazon MQ
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/mq.html#mqbroker
apiVersion: aws.konfig.io/v1alpha1
kind: MQBroker
metadata:
  name: example-mqbroker
  namespace: default
spec:
  autoMinorVersionUpgrade: false
  brokerName: example-mqbroker
  deploymentMode: SINGLE_INSTANCE
  engineType: ACTIVEMQ
  engineVersion: example
  hostInstanceType: example
  publiclyAccessible: false
  securityGroupRefs:
  - name: example-securitygrouprefs
  subnetRefs:
  - name: example-subnetrefs
  tags:
    environment: dev
    team: platform
  users:
  - consoleAccess: false
    groups:
    - example
    passwordRef:
      key: example
      name: example-mqbroker
    username: example-mqbroker
