---
# Attach an inline policy directly to a role (alternative to IAMPolicyAttachment)
apiVersion: aws.konfig.io/v1alpha1
kind: IAMRolePolicy
metadata:
  name: my-app-secrets-policy
  namespace: default
spec:
  roleRef:
    name: my-app-role
  policyName: SecretsAccess
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["secretsmanager:GetSecretValue"],
          "Resource": "arn:aws:secretsmanager:us-east-1:*:secret:my-app/*"
        }
      ]
    }
