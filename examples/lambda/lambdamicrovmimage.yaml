# LambdaMicrovmImage — Lambda
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/lambda.html#lambdamicrovmimage
apiVersion: aws.konfig.io/v1alpha1
kind: LambdaMicrovmImage
metadata:
  name: example-lambdamicrovmimage
  namespace: default
spec:
  additionalOsCapabilities:
  - example
  baseImageArn: arn:aws:iam::123456789012:role/example-role
  baseImageVersion: '1.0'
  buildRoleArn: arn:aws:iam::123456789012:role/example-role
  codeArtifact:
    uri: example
  cpuConfigurations:
  - architecture: ARM_64
  description: Managed by konfig-konector
  egressNetworkConnectors:
  - example
  environmentVariables:
  - key: example
    value: example
  hooks:
    microvmHooks:
      resume: DISABLED
      resumeTimeoutInSeconds: 1
      run: DISABLED
      runTimeoutInSeconds: 1
      suspend: DISABLED
      suspendTimeoutInSeconds: 1
      terminate: DISABLED
      terminateTimeoutInSeconds: 1
    microvmImageHooks:
      ready: DISABLED
      readyTimeoutInSeconds: 1
      validate: DISABLED
      validateTimeoutInSeconds: 1
    port: 1
  logging:
    cloudWatch:
      logGroup: example
      logStream: example
    disabled: false
  name: example-lambdamicrovmimage
  providerRef:
    name: example-lambdamicrovmimage
    region: us-east-1
  resources:
  - minimumMemoryInMiB: 1
  tags:
  - key: example
    value: example
