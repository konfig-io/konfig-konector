apiVersion: aws.konfig.io/v1alpha1
kind: LambdaFunction
metadata:
  name: example-lambdafunction
  namespace: default
spec:
  architecture: x86_64
  code:
    imageUri: example
    s3:
      s3Bucket: example
      s3Key: example
      s3ObjectVersion: '1.0'
  deadLetterConfig:
    targetARN: arn:aws:iam::123456789012:role/example-role
  description: Managed by konfig-konector
  environment:
    key: value
  ephemeralStorageSize: 2
  fileSystemConfigs:
  - arn: arn:aws:iam::123456789012:role/example-role
    localMountPath: example
  functionName: example-lambdafunction
  handler: example
  imageConfig:
    command:
    - example
    entryPoint:
    - example
    workingDirectory: example
  layers:
  - example
  loggingConfig:
    applicationLogLevel: TRACE
    logFormat: Text
    logGroup: example
    systemLogLevel: DEBUG
  memorySize: 128
  providerRef:
    name: example-lambdafunction
    region: us-east-1
  reservedConcurrency: 1
  roleArn: arn:aws:iam::123456789012:role/example-role
  roleRef:
    name: example-role
  runtime: '2026-01-01T00:00:00Z'
  snapStart:
    applyOn: PublishedVersions
  tags:
    environment: dev
    team: platform
  timeout: 1
  tracingConfig:
    mode: PassThrough
  vpcConfig:
    securityGroupRefs:
    - name: example-securitygrouprefs
    subnetRefs:
    - name: example-subnetrefs
