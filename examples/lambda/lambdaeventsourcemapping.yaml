# LambdaEventSourceMapping — Lambda
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/lambda.html#lambdaeventsourcemapping
apiVersion: aws.konfig.io/v1alpha1
kind: LambdaEventSourceMapping
metadata:
  name: example-lambdaeventsourcemapping
  namespace: default
spec:
  batchSize: 2
  enabled: true
  eventSourceArn: arn:aws:iam::123456789012:role/example-role
  filterCriteria:
    filters:
    - example
  functionArn: arn:aws:iam::123456789012:role/example-role
  functionRef:
    functionName: example-lambdaeventsourcemapping
    name: example-lambdaeventsourcemapping
  maximumBatchingWindowInSeconds: 300
  startingPosition: TRIM_HORIZON
