# LambdaCapacityProvider — Lambda
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/lambda.html#lambdacapacityprovider
apiVersion: aws.konfig.io/v1alpha1
kind: LambdaCapacityProvider
metadata:
  name: example-lambdacapacityprovider
  namespace: default
spec:
  capacityProviderName: example-lambdacapacityprovider
  capacityProviderScalingConfig:
    maxVCpuCount: 2
    scalingMode: Auto
    scalingPolicies:
    - predefinedMetricType: LambdaCapacityProviderAverageCPUUtilization
      targetValue: 1
  instanceRequirements:
    allowedInstanceTypes:
    - example
    architectures:
    - example
    excludedInstanceTypes:
    - example
  kmsKeyArn: arn:aws:iam::123456789012:role/example-role
  permissionsConfig:
    capacityProviderOperatorRoleArn: arn:aws:iam::123456789012:role/example-role
  propagateTags:
    explicitTags:
    - key: example
      value: example
    mode: None
  providerRef:
    name: example-lambdacapacityprovider
    region: us-east-1
  tags:
  - key: example
    value: example
  telemetryConfig:
    loggingConfig:
      logGroup: example
      systemLogLevel: DEBUG
  vpcConfig:
    securityGroupIds:
    - example
    subnetIds:
    - example
