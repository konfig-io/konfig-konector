apiVersion: aws.konfig.io/v1alpha1
kind: CloudFormationLambdaHook
metadata:
  name: example-cloudformationlambdahook
  namespace: default
spec:
  alias: example
  autoUpdate: false
  executionRole: example
  failureMode: FAIL
  hookStatus: ENABLED
  lambdaFunction: example
  loggingConfig:
    logGroupName: example-cloudformationlambdahook
    logRoleArn: arn:aws:iam::123456789012:role/example-role
