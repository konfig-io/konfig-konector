# LatticeListener — VPC Lattice
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/vpclattice.html#latticelistener
apiVersion: aws.konfig.io/v1alpha1
kind: LatticeListener
metadata:
  name: example-latticelistener
  namespace: default
spec:
  defaultAction:
    fixedResponse:
      statusCode: 100
    forward:
    - targetGroupRef:
        name: example-targetgroup
      weight: 1
  name: example-latticelistener
  port: 1
  protocol: HTTP
  providerRef:
    name: example-latticelistener
    region: us-east-1
  serviceRef:
    name: example-service
  tags:
    environment: dev
    team: platform
