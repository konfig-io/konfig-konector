# HealthCheck — Route 53
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/route53.html#healthcheck
apiVersion: aws.konfig.io/v1alpha1
kind: HealthCheck
metadata:
  name: example-healthcheck
  namespace: default
spec:
  failureThreshold: 1
  fqdn: example
  ipAddress: example
  port: 1
  providerRef:
    name: example-healthcheck
    region: us-east-1
  requestInterval: 1
  resourcePath: example
  searchString: example
  tags:
    environment: dev
    team: platform
  type: HTTP
