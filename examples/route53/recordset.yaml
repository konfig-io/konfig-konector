# RecordSet — Route 53
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/route53.html#recordset
apiVersion: aws.konfig.io/v1alpha1
kind: RecordSet
metadata:
  name: example-recordset
  namespace: default
spec:
  alias:
    dnsName: example-recordset
    evaluateTargetHealth: false
    hostedZoneId: Z0ABC123EXAMPLE
  failover: PRIMARY
  healthCheckRef:
    name: example-healthcheck
  hostedZoneRef:
    name: example-hostedzone
  name: example-recordset
  records:
  - example
  setIdentifier: example
  ttl: 1
  type: A
  weight: 1
