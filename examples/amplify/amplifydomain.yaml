# AmplifyDomain — Amplify
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/amplify.html#amplifydomain
apiVersion: aws.konfig.io/v1alpha1
kind: AmplifyDomain
metadata:
  name: example-amplifydomain
  namespace: default
spec:
  appId: example-id
  autoSubDomainCreationPatterns:
  - example
  autoSubDomainIAMRole: example
  certificateSettings:
    certificateType: AMPLIFY_MANAGED
    customCertificateArn: arn:aws:iam::123456789012:role/example-role
  domainName: example-amplifydomain
  enableAutoSubDomain: true
  providerRef:
    name: example-amplifydomain
    region: us-east-1
  subDomainSettings:
  - branchName: example-amplifydomain
    prefix: example
