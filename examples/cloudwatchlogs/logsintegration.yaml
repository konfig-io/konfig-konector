# LogsIntegration — CloudWatch Logs
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudwatchlogs.html#logsintegration
apiVersion: aws.konfig.io/v1alpha1
kind: LogsIntegration
metadata:
  name: example-logsintegration
  namespace: default
spec:
  integrationName: example-logsintegration
  integrationType: OPENSEARCH
  providerRef:
    name: example-logsintegration
    region: us-east-1
  resourceConfig:
    openSearchResourceConfig:
      applicationARN: arn:aws:iam::123456789012:role/example-role
      dashboardViewerPrincipals:
      - example
      dataSourceRoleArn: arn:aws:iam::123456789012:role/example-role
      kmsKeyArn: arn:aws:iam::123456789012:role/example-role
      retentionDays: 1
