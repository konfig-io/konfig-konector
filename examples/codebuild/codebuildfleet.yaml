# CodeBuildFleet — CodeBuild
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/codebuild.html#codebuildfleet
apiVersion: aws.konfig.io/v1alpha1
kind: CodeBuildFleet
metadata:
  name: example-codebuildfleet
  namespace: default
spec:
  baseCapacity: 1
  computeConfiguration:
    disk: 1
    instanceType: example
    machineType: GENERAL
    memory: 1
    vCpu: 1
  computeType: BUILD_GENERAL1_SMALL
  environmentType: WINDOWS_SERVER_2019_CONTAINER
  fleetProxyConfiguration:
    defaultBehavior: ALLOW_ALL
    orderedProxyRules:
    - effect: ALLOW
      entities:
      - example
      type: DOMAIN
  fleetServiceRole: example
  fleetVpcConfig:
    securityGroupIds:
    - example
    subnets:
    - example
  name: example-codebuildfleet
  overflowBehavior: QUEUE
  providerRef:
    name: example-codebuildfleet
    region: us-east-1
  scalingConfiguration:
    maxCapacity: 1
    scalingType: TARGET_TRACKING_SCALING
    targetTrackingScalingConfigs:
    - metricType: FLEET_UTILIZATION_RATE
      targetValue: 1
  tags:
  - key: example
    value: example
