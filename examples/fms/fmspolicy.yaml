# FMSPolicy — Firewall Manager
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/fms.html#fmspolicy
apiVersion: aws.konfig.io/v1alpha1
kind: FMSPolicy
metadata:
  name: example-fmspolicy
  namespace: default
spec:
  deleteAllPolicyResources: false
  excludeMap:
    account:
    - example
    orgunit:
    - example
  excludeResourceTags: false
  includeMap:
    account:
    - example
    orgunit:
    - example
  policyDescription: Managed by konfig-konector
  policyName: example-fmspolicy
  providerRef:
    name: example-fmspolicy
    region: us-east-1
  remediationEnabled: true
  resourceSetIds:
  - example
  resourceTagLogicalOperator: AND
  resourceTags:
  - key: example
    value: example
  resourceType: example
  resourceTypeList:
  - example
  resourcesCleanUp: false
  securityServicePolicyData:
    managedServiceData: example
    policyOption:
      networkAclCommonPolicy:
        networkAclEntrySet:
          firstEntries:
          - cidrBlock: 10.0.0.0/16
            egress: false
            ipv6CidrBlock: 2001:db8::/56
            protocol: example
            ruleAction: allow
          forceRemediateForFirstEntries: false
          forceRemediateForLastEntries: false
          lastEntries:
          - cidrBlock: 10.0.0.0/16
            egress: false
            ipv6CidrBlock: 2001:db8::/56
            protocol: example
            ruleAction: allow
      networkFirewallPolicy:
        firewallDeploymentModel: DISTRIBUTED
      thirdPartyFirewallPolicy:
        firewallDeploymentModel: DISTRIBUTED
    type: WAF
  tags:
  - key: example
    value: example
