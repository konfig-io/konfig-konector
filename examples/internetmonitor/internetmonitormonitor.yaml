# InternetMonitorMonitor — internetmonitor
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/internetmonitor.html#internetmonitormonitor
apiVersion: aws.konfig.io/v1alpha1
kind: InternetMonitorMonitor
metadata:
  name: example-internetmonitormonitor
  namespace: default
spec:
  healthEventsConfig:
    availabilityLocalHealthEventsConfig:
      healthScoreThreshold: 1
      minTrafficImpact: 1
      status: ENABLED
    availabilityScoreThreshold: 1
    performanceLocalHealthEventsConfig:
      healthScoreThreshold: 1
      minTrafficImpact: 1
      status: ENABLED
    performanceScoreThreshold: 1
  includeLinkedAccounts: false
  internetMeasurementsLogDelivery:
    s3Config:
      bucketName: example-internetmonitormonitor
      bucketPrefix: example
      logDeliveryStatus: ENABLED
  linkedAccountId: '123456789012'
  maxCityNetworksToMonitor: 1
  monitorName: example-internetmonitormonitor
  providerRef:
    name: example-internetmonitormonitor
    region: us-east-1
  resources:
  - example
  resourcesToAdd:
  - example
  resourcesToRemove:
  - example
  status: PENDING
  tags:
  - key: example
    value: example
  trafficPercentageToMonitor: 1
