# Budget — Budgets
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/budgets.html#budget
apiVersion: aws.konfig.io/v1alpha1
kind: Budget
metadata:
  name: example-budget
  namespace: default
spec:
  accountId: '123456789012'
  budgetName: example-budget
  budgetType: COST
  costFilters: {}
  limitAmount: '100'
  limitUnit: example
  notifications:
  - comparisonOperator: GREATER_THAN
    notificationType: ACTUAL
    subscribers:
    - address: example
      subscriptionType: EMAIL
    threshold: '100'
    thresholdType: PERCENTAGE
  providerRef:
    name: example-budget
    region: us-east-1
  timeUnit: DAILY
