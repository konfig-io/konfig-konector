# DataSyncTask — datasync
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/datasync.html#datasynctask
apiVersion: aws.konfig.io/v1alpha1
kind: DataSyncTask
metadata:
  name: example-datasynctask
  namespace: default
spec:
  cloudWatchLogGroupArn: arn:aws:iam::123456789012:role/example-role
  destinationLocationArn: arn:aws:iam::123456789012:role/example-role
  excludes:
  - filterType: SIMPLE_PATTERN
    value: example
  includes:
  - filterType: SIMPLE_PATTERN
    value: example
  manifestConfig:
    action: TRANSFER
    format: CSV
    source:
      s3:
        bucketAccessRoleArn: arn:aws:iam::123456789012:role/example-role
        manifestObjectPath: example
        s3BucketArn: arn:aws:iam::123456789012:role/example-role
  name: example-datasynctask
  options:
    atime: NONE
    bytesPerSecond: 1
    gid: NONE
    logLevel: 'OFF'
    mtime: NONE
    objectTags: PRESERVE
    overwriteMode: ALWAYS
    posixPermissions: NONE
    preserveDeletedFiles: PRESERVE
    preserveDevices: NONE
    securityDescriptorCopyFlags: NONE
    taskQueueing: ENABLED
    transferMode: CHANGED
    uid: NONE
    verifyMode: POINT_IN_TIME_CONSISTENT
  providerRef:
    name: example-datasynctask
    region: us-east-1
  schedule:
    scheduleExpression: example
    status: ENABLED
  sourceLocationArn: arn:aws:iam::123456789012:role/example-role
  tags:
  - key: example
    value: example
  taskMode: BASIC
  taskReportConfig:
    destination:
      s3:
        bucketAccessRoleArn: arn:aws:iam::123456789012:role/example-role
        s3BucketArn: arn:aws:iam::123456789012:role/example-role
        subdirectory: example
    objectVersionIds: INCLUDE
    outputType: SUMMARY_ONLY
    overrides:
      deleted:
        reportLevel: ERRORS_ONLY
      skipped:
        reportLevel: ERRORS_ONLY
      transferred:
        reportLevel: ERRORS_ONLY
      verified:
        reportLevel: ERRORS_ONLY
    reportLevel: ERRORS_ONLY
