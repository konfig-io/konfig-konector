apiVersion: aws.konfig.io/v1alpha1
kind: RolesAnywhereProfile
metadata:
  name: example-rolesanywhereprofile
  namespace: default
spec:
  acceptRoleSessionName: false
  attributeMappings:
  - certificateField: x509Subject
    mappingRules:
    - specifier: example
  durationSeconds: 300
  enabled: true
  managedPolicyArns:
  - example
  name: example-rolesanywhereprofile
  providerRef:
    name: example-rolesanywhereprofile
    region: us-east-1
  requireInstanceProperties: false
  roleArns:
  - arn:aws:iam::123456789012:role/example-role
  sessionPolicy: example
  tags:
  - key: example
    value: example
