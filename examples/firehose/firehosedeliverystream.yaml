# FirehoseDeliveryStream — Data Firehose
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/firehose.html#firehosedeliverystream
apiVersion: aws.konfig.io/v1alpha1
kind: FirehoseDeliveryStream
metadata:
  name: example-firehosedeliverystream
  namespace: default
spec:
  deliveryStreamName: example-firehosedeliverystream
  deliveryStreamType: DirectPut
  providerRef:
    name: example-firehosedeliverystream
    region: us-east-1
  s3DestinationConfiguration:
    bucketARN: arn:aws:iam::123456789012:role/example-role
    bufferingIntervalSeconds: 300
    bufferingSizeMBs: 2
    prefix: example
    roleARN: arn:aws:iam::123456789012:role/example-role
  tags:
    environment: dev
    team: platform
