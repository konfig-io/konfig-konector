apiVersion: aws.konfig.io/v1alpha1
kind: CodeDeployDeploymentConfig
metadata:
  name: example-codedeploydeploymentconfig
  namespace: default
spec:
  computePlatform: example
  deploymentConfigName: example-codedeploydeploymentconfig
  minimumHealthyHosts:
    type: example
    value: 1
  providerRef:
    name: example-codedeploydeploymentconfig
    region: us-east-1
  trafficRoutingConfig:
    timeBasedCanary:
      canaryInterval: 1
      canaryPercentage: 1
    timeBasedLinear:
      linearInterval: 1
      linearPercentage: 1
    type: example
  zonalConfig:
    firstZoneMonitorDurationInSeconds: 300
    minimumHealthyHostsPerZone:
      type: example
      value: 1
    monitorDurationInSeconds: 300
