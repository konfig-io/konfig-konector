apiVersion: aws.konfig.io/v1alpha1
kind: SecurityHubAutomationRuleV2
metadata:
  name: example-securityhubautomationrulev2
  namespace: default
spec:
  actions:
  - externalIntegrationConfiguration:
      connectorArn: arn:aws:iam::123456789012:role/example-role
    findingFieldsUpdate:
      comment: Managed by konfig-konector
      severityId: 1
      statusId: 1
    type: FINDING_FIELDS_UPDATE
  criteria:
    ocsfFindingCriteria:
      compositeFilters:
      - booleanFilters:
        - fieldName: compliance.assessments.meets_criteria
          filter:
            value: false
        dateFilters:
        - fieldName: finding_info.created_time_dt
          filter:
            end: example
            start: example
        mapFilters:
        - fieldName: resources.tags
          filter:
            comparison: EQUALS
            key: example
            value: example
        numberFilters:
        - fieldName: activity_id
          filter:
            eq: 1
            gte: 1
            lte: 1
        operator: AND
        stringFilters:
        - fieldName: activity_name
          filter:
            comparison: EQUALS
            value: example
      compositeOperator: AND
  description: Managed by konfig-konector
  providerRef:
    name: example-securityhubautomationrulev2
    region: us-east-1
  ruleName: example-securityhubautomationrulev2
  ruleOrder: 1
  ruleStatus: ENABLED
  tags:
    environment: dev
    team: platform
