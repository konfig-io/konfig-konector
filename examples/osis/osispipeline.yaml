# OSISPipeline — OpenSearch Ingestion
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/osis.html#osispipeline
apiVersion: aws.konfig.io/v1alpha1
kind: OSISPipeline
metadata:
  name: example-osispipeline
  namespace: default
spec:
  bufferOptions:
    persistentBufferEnabled: true
  encryptionAtRestOptions:
    kmsKeyArn: arn:aws:iam::123456789012:role/example-role
  logPublishingOptions:
    cloudWatchLogDestination:
      logGroup: example
    isLoggingEnabled: true
  maxUnits: 1
  minUnits: 1
  pipelineConfigurationBody: example
  pipelineName: example-osispipeline
  pipelineRoleArn: arn:aws:iam::123456789012:role/example-role
  providerRef:
    name: example-osispipeline
    region: us-east-1
  tags:
  - key: example
    value: example
  vpcOptions:
    securityGroupIds:
    - example
    subnetIds:
    - example
    vpcAttachmentOptions:
      attachToVpc: false
      cidrBlock: 10.0.0.0/16
    vpcEndpointManagement: CUSTOMER
