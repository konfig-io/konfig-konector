# CloudFrontContinuousDeploymentPolicy — CloudFront
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudfront.html#cloudfrontcontinuousdeploymentpolicy
apiVersion: aws.konfig.io/v1alpha1
kind: CloudFrontContinuousDeploymentPolicy
metadata:
  name: example-cloudfrontcontinuousdeploymentpolicy
  namespace: default
spec:
  continuousDeploymentPolicyConfig:
    enabled: true
    singleHeaderPolicyConfig:
      header: example
      value: example
    singleWeightPolicyConfig:
      sessionStickinessConfig:
        idleTTL: 300
        maximumTTL: 300
      weight: 1
    stagingDistributionDnsNames:
    - example
    trafficConfig:
      singleHeaderConfig:
        header: example
        value: example
      singleWeightConfig:
        weight: 1
      type: SingleWeight
    type: SingleWeight
  providerRef:
    name: example-cloudfrontcontinuousdeploymentpolicy
    region: us-east-1
