# CloudFrontTrustStore — CloudFront
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudfront.html#cloudfronttruststore
apiVersion: aws.konfig.io/v1alpha1
kind: CloudFrontTrustStore
metadata:
  name: example-cloudfronttruststore
  namespace: default
spec:
  caCertificatesBundleSource:
    caCertificatesBundleS3Location:
      bucket: example
      key: example
      region: us-east-1
      version: '1.0'
  name: example-cloudfronttruststore
  providerRef:
    name: example-cloudfronttruststore
    region: us-east-1
  tags:
  - key: example
    value: example
  useClientCertificateOCSPEndpoint: false
