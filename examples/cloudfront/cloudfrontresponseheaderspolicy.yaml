# CloudFrontResponseHeadersPolicy — CloudFront
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudfront.html#cloudfrontresponseheaderspolicy
apiVersion: aws.konfig.io/v1alpha1
kind: CloudFrontResponseHeadersPolicy
metadata:
  name: example-cloudfrontresponseheaderspolicy
  namespace: default
spec:
  providerRef:
    name: example-cloudfrontresponseheaderspolicy
    region: us-east-1
  responseHeadersPolicyConfig:
    comment: Managed by konfig-konector
    corsConfig:
      accessControlAllowCredentials: false
      accessControlAllowHeaders:
        items:
        - example
      accessControlAllowMethods:
        items:
        - example
      accessControlAllowOrigins:
        items:
        - example
      accessControlExposeHeaders:
        items:
        - example
      accessControlMaxAgeSec: 1
      originOverride: false
    customHeadersConfig:
      items:
      - header: example
        override: false
        value: example
    name: example-cloudfrontresponseheaderspolicy
    removeHeadersConfig:
      items:
      - header: example
    securityHeadersConfig:
      contentSecurityPolicy:
        contentSecurityPolicy: example
        override: false
      contentTypeOptions:
        override: false
      frameOptions:
        frameOption: example
        override: false
      referrerPolicy:
        override: false
        referrerPolicy: example
      strictTransportSecurity:
        accessControlMaxAgeSec: 1
        includeSubdomains: false
        override: false
        preload: false
      xssProtection:
        modeBlock: false
        override: false
        protection: true
        reportUri: example
    serverTimingHeadersConfig:
      enabled: true
      samplingRate: 1
