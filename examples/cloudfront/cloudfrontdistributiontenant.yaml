# CloudFrontDistributionTenant — CloudFront
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudfront.html#cloudfrontdistributiontenant
apiVersion: aws.konfig.io/v1alpha1
kind: CloudFrontDistributionTenant
metadata:
  name: example-cloudfrontdistributiontenant
  namespace: default
spec:
  customizations:
    certificate:
      name: example-certificate
    geoRestrictions:
      locations:
      - example
      restrictionType: blacklist
    webAcl:
      action: override
      arn: arn:aws:iam::123456789012:role/example-role
  distributionId: example-id
  domains:
  - example
  enabled: true
  managedCertificateRequest:
    certificateTransparencyLoggingPreference: enabled
    primaryDomainName: example-cloudfrontdistributiontenant
    validationTokenHost: cloudfront
  name: example-cloudfrontdistributiontenant
  parameters:
  - name: example-cloudfrontdistributiontenant
    value: example
  providerRef:
    name: example-cloudfrontdistributiontenant
    region: us-east-1
  tags:
  - key: example
    value: example
