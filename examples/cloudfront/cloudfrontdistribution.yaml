# CloudFrontDistribution — CloudFront
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudfront.html#cloudfrontdistribution
apiVersion: aws.konfig.io/v1alpha1
kind: CloudFrontDistribution
metadata:
  name: example-cloudfrontdistribution
  namespace: default
spec:
  aliases:
  - example
  comment: Managed by konfig-konector
  defaultCacheBehavior:
    allowedMethods:
    - example
    targetOriginId: example-id
    viewerProtocolPolicy: allow-all
  enabled: true
  origins:
  - domainName: example-cloudfrontdistribution
    id: example-id
    originPath: example
  priceClass: PriceClass_100
  providerRef:
    name: example-cloudfrontdistribution
    region: us-east-1
  tags:
    environment: dev
    team: platform
