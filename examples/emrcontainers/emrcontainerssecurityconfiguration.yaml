apiVersion: aws.konfig.io/v1alpha1
kind: EMRContainersSecurityConfiguration
metadata:
  name: example-emrcontainerssecurityconfiguration
  namespace: default
spec:
  containerProvider:
    id: example-id
    info:
      eksInfo:
        name: example-eksinfo
    type: EKS
  name: example-emrcontainerssecurityconfiguration
  providerRef:
    name: example-emrcontainerssecurityconfiguration
    region: us-east-1
  securityConfigurationData:
    authenticationConfiguration:
      iamConfiguration:
        systemRole: example
      identityCenterConfiguration:
        enableIdentityCenter: true
        identityCenterApplicationAssignmentRequired: false
        identityCenterInstanceARN: arn:aws:iam::123456789012:role/example-role
