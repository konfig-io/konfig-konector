# FSxS3AccessPointAttachment — fsx
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/fsx.html#fsxs3accesspointattachment
apiVersion: aws.konfig.io/v1alpha1
kind: FSxS3AccessPointAttachment
metadata:
  name: example-fsxs3accesspointattachment
  namespace: default
spec:
  name: example-fsxs3accesspointattachment
  ontapConfiguration:
    fileSystemIdentity:
      type: UNIX
      unixUser:
        name: example-unixuser
      windowsUser:
        name: example-windowsuser
    volumeId: example-id-xxxxxxxxxxxx
  openZFSConfiguration:
    fileSystemIdentity:
      posixUser:
        gid: 1
        secondaryGids:
        - gid: 1
        uid: 1
      type: POSIX
    volumeId: example-id-xxxxxxxxxxxx
  providerRef:
    name: example-fsxs3accesspointattachment
    region: us-east-1
  s3AccessPoint:
    alias: example
    resourceARN: arn:aws:iam::123456789012:role/example-role
    vpcConfiguration:
      vpcId: vpc-0abc12def3456789
  type: OPENZFS
