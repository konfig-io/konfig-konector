# CloudTrailDashboard — CloudTrail
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudtrail.html#cloudtraildashboard
apiVersion: aws.konfig.io/v1alpha1
kind: CloudTrailDashboard
metadata:
  name: example-cloudtraildashboard
  namespace: default
spec:
  name: example-cloudtraildashboard
  providerRef:
    name: example-cloudtraildashboard
    region: us-east-1
  refreshSchedule:
    frequency:
      unit: HOURS
      value: 1
    status: ENABLED
    timeOfDay: '2026-01-01T00:00:00Z'
  tags:
  - key: example
    value: example
  terminationProtectionEnabled: true
  widgets:
  - queryParameters:
    - example
    queryStatement: example
    viewProperties:
      key: value
