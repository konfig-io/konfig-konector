# DBProxy — multi
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/multi.html#dbproxy
apiVersion: aws.konfig.io/v1alpha1
kind: DBProxy
metadata:
  name: example-dbproxy
  namespace: default
spec:
  auth:
  - authScheme: example
    description: Managed by konfig-konector
    iamAuth: DISABLED
    secretArn: arn:aws:iam::123456789012:role/example-role
  dbProxyName: example-dbproxy
  debugLogging: false
  engineFamily: MYSQL
  idleClientTimeout: 300
  providerRef:
    name: example-dbproxy
    region: us-east-1
  requireTls: false
  roleArn: arn:aws:iam::123456789012:role/example-role
  tags:
    environment: dev
    team: platform
  vpcSecurityGroupIds:
  - example
  vpcSubnetIds:
  - example
