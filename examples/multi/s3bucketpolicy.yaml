apiVersion: aws.konfig.io/v1alpha1
kind: S3BucketPolicy
metadata:
  name: example-s3bucketpolicy
  namespace: default
spec:
  bucketRef:
    bucketName: example-s3bucketpolicy
    name: example-s3bucketpolicy
  policyDocument: '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["s3:GetObject"],
    "Resource": "*"}]}'
  providerRef:
    name: example-s3bucketpolicy
    region: us-east-1
