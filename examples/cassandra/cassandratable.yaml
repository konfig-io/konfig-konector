# CassandraTable — Keyspaces
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cassandra.html#cassandratable
apiVersion: aws.konfig.io/v1alpha1
kind: CassandraTable
metadata:
  name: example-cassandratable
  namespace: default
spec:
  autoScalingSpecifications:
    readCapacityAutoScaling:
      autoScalingDisabled: false
      maximumUnits: 1
      minimumUnits: 1
    writeCapacityAutoScaling:
      autoScalingDisabled: false
      maximumUnits: 1
      minimumUnits: 1
  billingMode:
    mode: PROVISIONED
    provisionedThroughput:
      readCapacityUnits: 1
      writeCapacityUnits: 1
  cdcSpecification:
    status: ENABLED
    tags:
    - key: example
      value: example
    viewType: NEW_IMAGE
  clientSideTimestampsEnabled: true
  clusteringKeyColumns:
  - column:
      columnName: example-cassandratable
      columnType: example
    orderBy: ASC
  defaultTimeToLive: 1
  encryptionSpecification:
    encryptionType: AWS_OWNED_KMS_KEY
    kmsKeyIdentifier: example
  keyspaceName: example-cassandratable
  partitionKeyColumns:
  - columnName: example-cassandratable
    columnType: example
  pointInTimeRecoveryEnabled: true
  providerRef:
    name: example-cassandratable
    region: us-east-1
  regularColumns:
  - columnName: example-cassandratable
    columnType: example
  replicaSpecifications:
  - readCapacityAutoScaling:
      autoScalingDisabled: false
      maximumUnits: 1
      minimumUnits: 1
    readCapacityUnits: 2
    region: us-east-1
  tableName: example-cassandratable
  tags:
  - key: example
    value: example
  warmThroughput:
    readUnitsPerSecond: 1
    writeUnitsPerSecond: 1
