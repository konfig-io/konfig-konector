apiVersion: aws.konfig.io/v1alpha1
kind: CassandraKeyspace
metadata:
  name: example-cassandrakeyspace
  namespace: default
spec:
  clientSideTimestampsEnabled: true
  keyspaceName: example-cassandrakeyspace
  providerRef:
    name: example-cassandrakeyspace
    region: us-east-1
  replicationSpecification:
    regionList:
    - example
    replicationStrategy: SINGLE_REGION
  tags:
  - key: example
    value: example
