# KafkaConnectConnector — kafkaconnect
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/kafkaconnect.html#kafkaconnectconnector
apiVersion: aws.konfig.io/v1alpha1
kind: KafkaConnectConnector
metadata:
  name: example-kafkaconnectconnector
  namespace: default
spec:
  capacity:
    autoScaling:
      maxAutoscalingTaskCount: 2
      maxWorkerCount: 2
      mcuCount: 2
      minWorkerCount: 2
      scaleInPolicy:
        cpuUtilizationPercentage: 1
      scaleOutPolicy:
        cpuUtilizationPercentage: 1
    provisionedCapacity:
      mcuCount: 2
      workerCount: 2
  connectorConfiguration:
    key: value
  connectorDescription: Managed by konfig-konector
  connectorName: example-kafkaconnectconnector
  kafkaCluster:
    apacheKafkaCluster:
      bootstrapServers: example
      vpc:
        securityGroups:
        - example
        subnets:
        - example
  kafkaClusterClientAuthentication:
    authenticationType: NONE
  kafkaClusterEncryptionInTransit:
    encryptionType: PLAINTEXT
  kafkaConnectVersion: '1.0'
  logDelivery:
    workerLogDelivery:
      cloudWatchLogs:
        enabled: true
        logGroup: example
      firehose:
        deliveryStream: example
        enabled: true
      s3:
        bucket: example
        enabled: true
        prefix: example
  networkType: IPV4
  plugins:
  - customPlugin:
      customPluginArn: arn:aws:iam::123456789012:role/example-role
      revision: 1
  providerRef:
    name: example-kafkaconnectconnector
    region: us-east-1
  serviceExecutionRoleArn: arn:aws:iam::123456789012:role/example-role
  tags:
  - key: example
    value: example
  workerConfiguration:
    revision: 1
    workerConfigurationArn: arn:aws:iam::123456789012:role/example-role
