# EventBridgeEndpoint — EventBridge
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/eventbridge.html#eventbridgeendpoint
apiVersion: aws.konfig.io/v1alpha1
kind: EventBridgeEndpoint
metadata:
  name: example-eventbridgeendpoint
  namespace: default
spec:
  description: Managed by konfig-konector
  eventBuses:
  - eventBusArn: arn:aws:iam::123456789012:role/example-role
  name: example-eventbridgeendpoint
  providerRef:
    name: example-eventbridgeendpoint
    region: us-east-1
  replicationConfig:
    state: ENABLED
  roleArn: arn:aws:iam::123456789012:role/example-role
  routingConfig:
    failoverConfig:
      primary:
        healthCheck: example
      secondary:
        route: example-x
