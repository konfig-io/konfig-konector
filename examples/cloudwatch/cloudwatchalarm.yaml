# CloudWatchAlarm — CloudWatch
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/cloudwatch.html#cloudwatchalarm
apiVersion: aws.konfig.io/v1alpha1
kind: CloudWatchAlarm
metadata:
  name: example-cloudwatchalarm
  namespace: default
spec:
  actionsEnabled: true
  alarmActions:
  - example
  alarmDescription: Managed by konfig-konector
  alarmName: example-cloudwatchalarm
  comparisonOperator: GreaterThanOrEqualToThreshold
  datapointsToAlarm: 1
  dimensions:
  - name: example-cloudwatchalarm
    value: example
  evaluationPeriods: 1
  insufficientDataActions:
  - example
  metricName: example-cloudwatchalarm
  namespace: example
  okActions:
  - example
  period: 1
  providerRef:
    name: example-cloudwatchalarm
    region: us-east-1
  statistic: SampleCount
  tags:
    environment: dev
    team: platform
  threshold: 1
  treatMissingData: breaching
  unit: example
