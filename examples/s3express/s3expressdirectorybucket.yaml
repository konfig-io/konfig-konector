# S3ExpressDirectoryBucket — s3express
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3express.html#s3expressdirectorybucket
apiVersion: aws.konfig.io/v1alpha1
kind: S3ExpressDirectoryBucket
metadata:
  name: example-s3expressdirectorybucket
  namespace: default
spec:
  bucketEncryption:
    serverSideEncryptionConfiguration:
    - bucketKeyEnabled: true
  bucketName: example-s3expressdirectorybucket
  dataRedundancy: SingleAvailabilityZone
  inventoryConfigurations:
  - destination:
      bucketAccountId: '123456789012'
      bucketArn: arn:aws:iam::123456789012:role/example-role
      format: CSV
      prefix: example
    enabled: true
    id: example-id
    includedObjectVersions: All
    optionalFields:
    - example
    prefix: example
    scheduleFrequency: Daily
  lifecycleConfiguration:
    rules:
    - expirationInDays: 7
      objectSizeGreaterThan: example
      objectSizeLessThan: example
      prefix: example
      status: Enabled
  locationName: example-s3expressdirectorybucket
  metricsConfigurations:
  - accessPointArn: arn:aws:iam::123456789012:role/example-role
    id: example-id
    prefix: example
  providerRef:
    name: example-s3expressdirectorybucket
    region: us-east-1
  tags:
  - key: example
    value: example
