# S3ExpressAccessPoint — S3 Express
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/s3express.html#s3expressaccesspoint
apiVersion: aws.konfig.io/v1alpha1
kind: S3ExpressAccessPoint
metadata:
  name: example-s3expressaccesspoint
  namespace: default
spec:
  bucket: example
  bucketAccountId: '123456789012'
  name: example-s3expressaccesspoint
  providerRef:
    name: example-s3expressaccesspoint
    region: us-east-1
  publicAccessBlockConfiguration:
    blockPublicAcls: false
    blockPublicPolicy: false
    ignorePublicAcls: false
    restrictPublicBuckets: false
  scope:
    permissions:
    - example
    prefixes:
    - example
  tags:
  - key: example
    value: example
