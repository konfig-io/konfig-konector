# ECSCapacityProvider — ECS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ecs.html#ecscapacityprovider
apiVersion: aws.konfig.io/v1alpha1
kind: ECSCapacityProvider
metadata:
  name: example-ecscapacityprovider
  namespace: default
spec:
  autoScalingGroupProvider:
    autoScalingGroupArn: arn:aws:iam::123456789012:role/example-role
    managedScaling:
      instanceWarmupPeriod: 1
      maximumScalingStepSize: 2
      minimumScalingStepSize: 2
      status: ENABLED
      targetCapacity: 1
    managedTerminationProtection: ENABLED
  name: example-ecscapacityprovider
  tags:
    environment: dev
    team: platform
