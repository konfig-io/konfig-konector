# ECSService — ECS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ecs.html#ecsservice
apiVersion: aws.konfig.io/v1alpha1
kind: ECSService
metadata:
  name: example-ecsservice
  namespace: default
spec:
  clusterName: example-ecsservice
  clusterRef:
    clusterName: example-ecsservice
    name: example-ecsservice
  desiredCount: 1
  enableExecuteCommand: true
  healthCheckGracePeriodSeconds: 300
  launchType: FARGATE
  loadBalancers:
  - containerName: example-ecsservice
    containerPort: 443
    targetGroupArn: arn:aws:iam::123456789012:role/example-role
  networkConfiguration:
    assignPublicIp: ENABLED
    securityGroupRefs:
    - name: example-securitygrouprefs
    subnetRefs:
    - name: example-subnetrefs
  providerRef:
    name: example-ecsservice
    region: us-east-1
  serviceName: example-ecsservice
  tags:
    environment: dev
    team: platform
  taskDefinitionArn: arn:aws:iam::123456789012:role/example-role
  taskDefinitionRef:
    name: example-taskdefinition
