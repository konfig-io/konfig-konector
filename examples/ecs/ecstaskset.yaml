# ECSTaskSet — ECS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ecs.html#ecstaskset
apiVersion: aws.konfig.io/v1alpha1
kind: ECSTaskSet
metadata:
  name: example-ecstaskset
  namespace: default
spec:
  capacityProviderStrategy:
  - base: 1
    capacityProvider: example
    weight: 1
  cluster: example
  launchType: EC2
  loadBalancers:
  - containerName: example-ecstaskset
    containerPort: 443
    targetGroupArn: arn:aws:iam::123456789012:role/example-role
  networkConfiguration:
    awsVpcConfiguration:
      assignPublicIp: DISABLED
      securityGroups:
      - example
      subnets:
      - example
  platformVersion: '1.0'
  providerRef:
    name: example-ecstaskset
    region: us-east-1
  scale:
    unit: PERCENT
    value: 1
  service: example
  serviceRegistries:
  - containerName: example-ecstaskset
    containerPort: 443
    port: 443
    registryArn: arn:aws:iam::123456789012:role/example-role
  tags:
  - key: example
    value: example
  taskDefinition: example
