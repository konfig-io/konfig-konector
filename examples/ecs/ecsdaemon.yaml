# ECSDaemon — ECS
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/ecs.html#ecsdaemon
apiVersion: aws.konfig.io/v1alpha1
kind: ECSDaemon
metadata:
  name: example-ecsdaemon
  namespace: default
spec:
  capacityProviderArns:
  - example
  clusterArn: arn:aws:iam::123456789012:role/example-role
  daemonName: example-ecsdaemon
  daemonTaskDefinitionArn: arn:aws:iam::123456789012:role/example-role
  deploymentConfiguration:
    alarms:
      alarmNames:
      - example
      enable: true
    bakeTimeInMinutes: 1
    drainPercent: 1
  enableECSManagedTags: true
  enableExecuteCommand: true
  propagateTags: DAEMON
  providerRef:
    name: example-ecsdaemon
    region: us-east-1
  tags:
  - key: example
    value: example
