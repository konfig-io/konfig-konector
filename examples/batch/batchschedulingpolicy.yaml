# BatchSchedulingPolicy — Batch
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/batch.html#batchschedulingpolicy
apiVersion: aws.konfig.io/v1alpha1
kind: BatchSchedulingPolicy
metadata:
  name: example-batchschedulingpolicy
  namespace: default
spec:
  fairsharePolicy:
    computeReservation: 1
    shareDecaySeconds: 300
    shareDistribution:
    - shareIdentifier: example
      weightFactor: 1
  name: example-batchschedulingpolicy
  providerRef:
    name: example-batchschedulingpolicy
    region: us-east-1
  quotaSharePolicy:
    idleResourceAssignmentStrategy: FIFO
  tags:
    environment: dev
    team: platform
