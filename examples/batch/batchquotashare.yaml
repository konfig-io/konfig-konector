apiVersion: aws.konfig.io/v1alpha1
kind: BatchQuotaShare
metadata:
  name: example-batchquotashare
  namespace: default
spec:
  capacityLimits:
  - capacityUnit: example
    maxCapacity: 1
  jobQueue: example
  preemptionConfiguration:
    inSharePreemption: ENABLED
  providerRef:
    name: example-batchquotashare
    region: us-east-1
  quotaShareName: example-batchquotashare
  resourceSharingConfiguration:
    borrowLimit: 1
    strategy: RESERVE
  state: ENABLED
  tags:
    environment: dev
    team: platform
