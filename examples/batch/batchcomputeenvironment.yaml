apiVersion: aws.konfig.io/v1alpha1
kind: BatchComputeEnvironment
metadata:
  name: example-batchcomputeenvironment
  namespace: default
spec:
  computeResources:
    desiredvCpus: 1
    instanceRoleArn: arn:aws:iam::123456789012:role/example-role
    instanceTypes:
    - example
    maxvCpus: 1
    minvCpus: 1
    securityGroupRefs:
    - name: example-securitygrouprefs
    subnetRefs:
    - name: example-subnetrefs
    type: FARGATE
  name: example-batchcomputeenvironment
  providerRef:
    name: example-batchcomputeenvironment
    region: us-east-1
  state: ENABLED
  tags:
    environment: dev
    team: platform
  type: MANAGED
