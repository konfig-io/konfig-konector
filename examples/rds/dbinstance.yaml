# DBInstance — RDS & Aurora
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/rds.html#dbinstance
apiVersion: aws.konfig.io/v1alpha1
kind: DBInstance
metadata:
  name: example-dbinstance
  namespace: default
spec:
  allocatedStorage: 5
  autoMinorVersionUpgrade: false
  backupRetentionPeriod: 1
  copyTagsToSnapshot: false
  dbInstanceClass: example
  dbInstanceIdentifier: example
  dbName: example-dbinstance
  dbParameterGroupRef: example
  dbSubnetGroupRef: example
  deletionProtection: true
  enableIAMDatabaseAuthentication: true
  enablePerformanceInsights: true
  enabledCloudwatchLogsExports:
  - example
  engine: example
  engineVersion: example
  iops: 1
  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  masterUserPasswordRef:
    key: example
    name: example-dbinstance
  masterUsername: example-dbinstance
  maxAllocatedStorage: 1
  monitoringInterval: 1
  monitoringRoleArn: arn:aws:iam::123456789012:role/example-role
  multiAZ: false
  performanceInsightsKmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  performanceInsightsRetentionPeriod: 7
  port: 443
  preferredBackupWindow: example
  preferredMaintenanceWindow: example
  providerRef:
    name: example-dbinstance
    region: us-east-1
  publiclyAccessible: false
  skipFinalSnapshot: false
  storageEncrypted: true
  storageThroughput: 1
  storageType: gp2
  tags:
    environment: dev
    team: platform
  vpcSecurityGroupRefs:
  - name: example-vpcsecuritygrouprefs
