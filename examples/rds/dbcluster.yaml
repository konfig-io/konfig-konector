# DBCluster — RDS & Aurora
# Full-options example generated from the CRD schema. Optional fields are
# included with sample values; delete what you don't need. Field reference:
# https://konfig-konector.io/docs/rds.html#dbcluster
apiVersion: aws.konfig.io/v1alpha1
kind: DBCluster
metadata:
  name: example-dbcluster
  namespace: default
spec:
  allocatedStorage: 1
  autoMinorVersionUpgrade: false
  backtrackWindow: 1
  backupRetentionPeriod: 1
  copyTagsToSnapshot: false
  dbClusterIdentifier: example
  dbClusterParameterGroupRef: example
  dbSubnetGroupRef: example
  deletionProtection: true
  enableHttpEndpoint: true
  enableIAMDatabaseAuthentication: true
  enabledCloudwatchLogsExports:
  - example
  engine: aurora-mysql
  engineMode: provisioned
  engineVersion: example
  kmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  masterUserPasswordRef:
    key: example
    name: example-dbcluster
  masterUsername: example-dbcluster
  networkType: IPV4
  performanceInsightsEnabled: true
  performanceInsightsKmsKeyId: arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
  performanceInsightsRetentionPeriod: 7
  port: 443
  preferredBackupWindow: example
  preferredMaintenanceWindow: example
  providerRef:
    name: example-dbcluster
    region: us-east-1
  serverlessV2ScalingConfig:
    maxCapacity: 2
    minCapacity: 2
  skipFinalSnapshot: false
  storageEncrypted: true
  storageType: example
  tags:
    environment: dev
    team: platform
  vpcSecurityGroupRefs:
  - name: example-vpcsecuritygrouprefs
