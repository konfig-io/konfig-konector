apiVersion: aws.konfig.io/v1alpha1
kind: SSOAdminApplication
metadata:
  name: example-ssoadminapplication
  namespace: default
spec:
  applicationProviderArn: arn:aws:iam::123456789012:role/example-role
  description: Managed by konfig-konector
  instanceArn: arn:aws:iam::123456789012:role/example-role
  name: example-ssoadminapplication
  portalOptions:
    signInOptions:
      applicationUrl: example
      origin: IDENTITY_CENTER
    visibility: ENABLED
  providerRef:
    name: example-ssoadminapplication
    region: us-east-1
  status: ENABLED
  tags:
  - key: example
    value: example
