kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: amis.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: AMI
    listKind: AMIList
    plural: amis
    singular: ami
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.imageId
      name: ImageID
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AMI is the Schema for managing EC2 Amazon Machine Images.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AMISpec defines the desired state of an AMI registration.
            properties:
              architecture:
                description: Architecture is the CPU architecture (x86_64 or arm64).
                enum:
                - x86_64
                - arm64
                - i386
                type: string
              blockDeviceMappings:
                description: BlockDeviceMappings defines the EBS volumes and snapshots
                  to attach.
                items:
                  description: AMIBlockDeviceMapping defines an EBS block device mapping
                    for an AMI.
                  properties:
                    deleteOnTermination:
                      description: DeleteOnTermination controls whether to delete
                        on instance termination.
                      type: boolean
                    deviceName:
                      description: DeviceName is the device name (e.g. /dev/xvda).
                      minLength: 1
                      type: string
                    encrypted:
                      description: Encrypted enables encryption for this volume.
                      type: boolean
                    snapshotId:
                      description: SnapshotID is the snapshot to use for this device.
                      type: string
                    volumeSize:
                      description: VolumeSize is the size of the volume in GiB.
                      format: int32
                      type: integer
                    volumeType:
                      description: VolumeType is the EBS volume type.
                      type: string
                  required:
                  - deviceName
                  type: object
                type: array
              description:
                description: Description is an optional description.
                type: string
              enaSupport:
                description: ENASupport enables enhanced networking with ENA.
                type: boolean
              kernelId:
                description: KernelID is an optional kernel ID (for paravirtual).
                type: string
              name:
                description: Name is the AMI name. Must be unique within the account/region.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              ramdiskId:
                description: RamdiskID is an optional ramdisk ID.
                type: string
              rootDeviceName:
                description: RootDeviceName is the root device name (e.g. /dev/xvda).
                type: string
              sriovNetSupport:
                description: SRIOVNetSupport enables SR-IOV networking (set to "simple").
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply.
                type: object
              virtualizationType:
                description: VirtualizationType is hvm or paravirtual.
                enum:
                - hvm
                - paravirtual
                type: string
            required:
            - name
            type: object
          status:
            description: AMIStatus defines the observed state of AMI.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              imageId:
                description: ImageID is the AMI ID.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              state:
                description: State is the current state of the AMI (pending, available,
                  failed, etc.).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
