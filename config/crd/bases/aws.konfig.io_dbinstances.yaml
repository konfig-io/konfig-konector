---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: dbinstances.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: DBInstance
    listKind: DBInstanceList
    plural: dbinstances
    singular: dbinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.dbInstanceStatus
      name: DB-Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DBInstance is the Schema for managing RDS DB Instances.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DBInstanceSpec defines the desired state of an RDS DB Instance.
            properties:
              allocatedStorage:
                description: AllocatedStorage is the storage size in GiB.
                format: int32
                minimum: 5
                type: integer
              autoMinorVersionUpgrade:
                description: AutoMinorVersionUpgrade enables automatic minor version
                  upgrades during the maintenance window.
                type: boolean
              backupRetentionPeriod:
                description: BackupRetentionPeriod is the number of days to retain
                  automated backups (0 to disable).
                format: int32
                maximum: 35
                minimum: 0
                type: integer
              copyTagsToSnapshot:
                description: CopyTagsToSnapshot copies tags to automated DB snapshots.
                type: boolean
              dbInstanceClass:
                description: DBInstanceClass is the compute and memory capacity (e.g.
                  db.t3.micro).
                minLength: 1
                type: string
              dbInstanceIdentifier:
                description: DBInstanceIdentifier is the unique name for the DB instance.
                  Immutable after creation.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: dbInstanceIdentifier is immutable
                  rule: self == oldSelf
              dbName:
                description: DBName is the name of the initial database. Immutable
                  after creation.
                type: string
              dbParameterGroupRef:
                description: DBParameterGroupRef is the name of a DBParameterGroup
                  CR in the same namespace.
                type: string
              dbSubnetGroupRef:
                description: DBSubnetGroupRef is the name of a DBSubnetGroup CR in
                  the same namespace.
                type: string
              deletionProtection:
                description: DeletionProtection prevents the DB instance from being
                  deleted.
                type: boolean
              enableIAMDatabaseAuthentication:
                description: EnableIAMDatabaseAuthentication enables IAM database
                  authentication.
                type: boolean
              enablePerformanceInsights:
                description: EnablePerformanceInsights enables Performance Insights
                  for the DB instance.
                type: boolean
              enabledCloudwatchLogsExports:
                description: EnabledCloudwatchLogsExports is the list of log types
                  to export to CloudWatch.
                items:
                  type: string
                type: array
              engine:
                description: Engine is the database engine (e.g. mysql, postgres,
                  mariadb).
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: engine is immutable
                  rule: self == oldSelf
              engineVersion:
                description: EngineVersion is the version of the database engine.
                type: string
              iops:
                description: Iops is the I/O operations per second for io1/io2 storage.
                format: int32
                type: integer
              kmsKeyId:
                description: KMSKeyID is the KMS key ARN/ID for storage encryption.
                type: string
              masterUserPasswordRef:
                description: MasterUserPasswordRef references a Kubernetes Secret
                  containing the master password.
                properties:
                  key:
                    description: Key is the key within the Secret whose value to use.
                    type: string
                  name:
                    description: Name of the Kubernetes Secret.
                    type: string
                required:
                - key
                - name
                type: object
              masterUsername:
                description: MasterUsername is the login name for the master user.
                  Immutable after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: masterUsername is immutable
                  rule: self == oldSelf
              maxAllocatedStorage:
                description: MaxAllocatedStorage enables storage autoscaling up to
                  this size in GiB.
                format: int32
                type: integer
              monitoringInterval:
                description: MonitoringInterval is the interval in seconds for Enhanced
                  Monitoring metrics (0, 1, 5, 10, 15, 30, 60).
                format: int32
                type: integer
              monitoringRoleArn:
                description: MonitoringRoleARN is the IAM role ARN for Enhanced Monitoring.
                type: string
              multiAZ:
                description: MultiAZ enables a Multi-AZ deployment.
                type: boolean
              performanceInsightsKmsKeyId:
                description: PerformanceInsightsKMSKeyID is the KMS key ARN/ID for
                  Performance Insights encryption.
                type: string
              performanceInsightsRetentionPeriod:
                description: PerformanceInsightsRetentionPeriod is the number of days
                  to retain Performance Insights data (7 or 731).
                format: int32
                type: integer
              port:
                description: Port is the port the DB listens on.
                format: int32
                type: integer
              preferredBackupWindow:
                description: PreferredBackupWindow is the daily time range for automated
                  backups (e.g. "02:00-03:00").
                type: string
              preferredMaintenanceWindow:
                description: PreferredMaintenanceWindow is the weekly time range for
                  maintenance (e.g. "sun:05:00-sun:06:00").
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              publiclyAccessible:
                description: PubliclyAccessible controls whether the DB is publicly
                  accessible.
                type: boolean
              skipFinalSnapshot:
                description: SkipFinalSnapshot skips the final snapshot when the instance
                  is deleted.
                type: boolean
              storageEncrypted:
                description: StorageEncrypted enables encryption at rest.
                type: boolean
              storageThroughput:
                description: StorageThroughput is the storage throughput in MiB/s
                  for gp3 storage.
                format: int32
                type: integer
              storageType:
                description: 'StorageType is the storage type: gp2, gp3, or io1.'
                enum:
                - gp2
                - gp3
                - io1
                - standard
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply.
                type: object
              vpcSecurityGroupRefs:
                description: VPCSecurityGroupRefs is the list of VPC security group
                  references.
                items:
                  description: SecurityGroupRef references either a managed SecurityGroup
                    CR or a direct Security Group ID.
                  properties:
                    id:
                      description: ID is a direct AWS Security Group ID (e.g. sg-0abc1234).
                      type: string
                    name:
                      description: Name of a SecurityGroup CR in the same namespace.
                      type: string
                  type: object
                type: array
            required:
            - allocatedStorage
            - dbInstanceClass
            - dbInstanceIdentifier
            - engine
            - masterUserPasswordRef
            - masterUsername
            type: object
          status:
            description: DBInstanceStatus defines the observed state of DBInstance.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dbInstanceArn:
                description: DBInstanceARN is the Amazon Resource Name of the DB instance.
                type: string
              dbInstanceStatus:
                description: DBInstanceStatus is the current status (available, creating,
                  modifying, deleting, etc.).
                type: string
              endpoint:
                description: Endpoint is the connection endpoint hostname.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              port:
                description: Port is the connection port.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
