---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: schedules.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: Schedule
    listKind: ScheduleList
    plural: schedules
    singular: schedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scheduleExpression
      name: Expression
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Schedule is the Schema for managing EventBridge Scheduler schedules.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScheduleSpec defines the desired state of an EventBridge
              Scheduler schedule.
            properties:
              description:
                description: Description of the schedule.
                type: string
              flexibleTimeWindow:
                description: FlexibleTimeWindow configures the invocation window.
                properties:
                  maximumWindowInMinutes:
                    description: MaximumWindowInMinutes is the maximum window when
                      mode is FLEXIBLE.
                    format: int32
                    maximum: 1440
                    minimum: 1
                    type: integer
                  mode:
                    description: Mode is OFF or FLEXIBLE.
                    enum:
                    - "OFF"
                    - FLEXIBLE
                    type: string
                required:
                - mode
                type: object
              groupRef:
                description: GroupRef references the schedule group. If unset, the
                  default group is used.
                properties:
                  groupName:
                    description: GroupName is a direct AWS schedule group name, bypassing
                      CR lookup.
                    type: string
                  name:
                    description: Name of a ScheduleGroup CR in the same namespace.
                    type: string
                type: object
              name:
                description: Name is the name of the schedule. Immutable after creation.
                maxLength: 64
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              scheduleExpression:
                description: ScheduleExpression, e.g. rate(5 minutes), cron(0 12 *
                  * ? *), or at(...).
                minLength: 1
                type: string
              state:
                description: State is ENABLED or DISABLED. Defaults to ENABLED.
                enum:
                - ENABLED
                - DISABLED
                type: string
              target:
                description: Target is the resource invoked by the schedule.
                properties:
                  arn:
                    description: ARN of the target resource (Lambda function, SQS
                      queue, ECS cluster...).
                    minLength: 1
                    type: string
                  deadLetterArn:
                    description: DeadLetterARN is the ARN of an SQS queue for failed
                      invocations.
                    type: string
                  input:
                    description: Input is a static JSON payload passed to the target.
                    type: string
                  retryPolicy:
                    description: RetryPolicy for target invocation.
                    properties:
                      maximumEventAgeInSeconds:
                        description: MaximumEventAgeInSeconds is the maximum age of
                          an event to retry.
                        format: int32
                        maximum: 86400
                        minimum: 60
                        type: integer
                      maximumRetryAttempts:
                        description: MaximumRetryAttempts before the invocation is
                          dropped or dead-lettered.
                        format: int32
                        maximum: 185
                        minimum: 0
                        type: integer
                    type: object
                  roleRef:
                    description: |-
                      RoleRef references the IAM role EventBridge Scheduler assumes to invoke
                      the target (by CR name or direct ARN).
                    properties:
                      arn:
                        description: |-
                          ARN is a direct AWS IAM role ARN.
                          If set, Name and Namespace are ignored.
                        type: string
                      name:
                        description: Name of an IAMRole CR in the same namespace.
                        type: string
                      namespace:
                        description: Namespace of the IAMRole CR. Defaults to the
                          referring object's namespace.
                        type: string
                    type: object
                required:
                - arn
                - roleRef
                type: object
              timezone:
                description: Timezone for the schedule expression, e.g. America/New_York.
                type: string
            required:
            - flexibleTimeWindow
            - name
            - scheduleExpression
            - target
            type: object
          status:
            description: ScheduleStatus defines the observed state of Schedule.
            properties:
              arn:
                description: ARN is the ARN of the schedule.
                type: string
              awsProvider:
                description: AWSProvider confirms the account and region this resource
                  was reconciled against.
                properties:
                  accountId:
                    description: AccountID the resource lives in.
                    type: string
                  name:
                    description: Name of the AWSProvider used; empty when the operator's
                      own credentials were used.
                    type: string
                  region:
                    description: Region the resource lives in (empty for global services).
                    type: string
                type: object
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
