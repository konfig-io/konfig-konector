              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ECSTaskDefinitionSpec defines the desired state of an ECS Task Definition.
              A new revision is registered whenever the spec changes.
            properties:
              containerDefinitions:
                description: ContainerDefinitions is the list of containers in the
                  task.
                items:
                  description: ECSContainerDefinition defines a container within a
                    task definition.
                  properties:
                    command:
                      description: Command overrides the container CMD.
                      items:
                        type: string
                      type: array
                    cpu:
                      description: CPU units to reserve for the container. 1024 =
