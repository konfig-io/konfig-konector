                        required:
                        - containerPort
                        type: object
                      type: array
                  required:
                  - image
                  - name
                  type: object
                minItems: 1
                type: array
              cpu:
                description: |-
                  CPU is the number of vCPU units for the task (e.g. "256", "512", "1024").
                  Required for Fargate.
                type: string
              executionRoleArn:
                description: |-
                  ExecutionRoleArn is the ARN of the task execution role.
                  Either executionRoleArn or executionRoleRef must be set for Fargate.
                type: string
              executionRoleRef:
                description: ExecutionRoleRef references an IAMRole CR in the same
                  namespace.
                properties:
                  arn:
                    description: |-
                      ARN is a direct AWS IAM role ARN.
                      If set, Name and Namespace are ignored.
                    type: string
                  name:
                    description: Name of an IAMRole CR in the same namespace.
                    type: string
                  namespace:
