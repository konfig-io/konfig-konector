---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: scproducts.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: SCProduct
    listKind: SCProductList
    plural: scproducts
    singular: scproduct
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.productId
      name: Product-ID
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SCProduct is the Schema for managing AWS Service Catalog products.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SCProductSpec defines the desired state of an AWS Service
              Catalog product.
            properties:
              description:
                description: Description of the product.
                type: string
              distributor:
                description: Distributor of the product.
                type: string
              name:
                description: Name of the product.
                minLength: 1
                type: string
              owner:
                description: Owner of the product.
                minLength: 1
                type: string
              productType:
                default: CLOUD_FORMATION_TEMPLATE
                description: ProductType of the product. Immutable after creation.
                enum:
                - CLOUD_FORMATION_TEMPLATE
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              provisioningArtifact:
                description: |-
                  ProvisioningArtifact is the initial version of the product. Only used
                  at creation; add further versions outside this CR.
                properties:
                  description:
                    description: Description of the provisioning artifact.
                    type: string
                  name:
                    description: Name of the provisioning artifact (e.g. "v1").
                    minLength: 1
                    type: string
                  templateUrl:
                    description: |-
                      TemplateURL is the S3 (or GitHub) URL of the CloudFormation template,
                      passed as LoadTemplateFromURL.
                    minLength: 1
                    type: string
                required:
                - name
                - templateUrl
                type: object
              supportEmail:
                description: SupportEmail is the contact email for product support.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply.
                type: object
            required:
            - name
            - owner
            - provisioningArtifact
            type: object
          status:
            description: SCProductStatus defines the observed state of SCProduct.
            properties:
              arn:
                description: ARN is the Amazon Resource Name of the product.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              productId:
                description: ProductID is the Service Catalog product identifier (prod-...).
                type: string
              provisioningArtifactId:
                description: |-
                  ProvisioningArtifactID is the identifier of the initial provisioning
                  artifact created with the product.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
