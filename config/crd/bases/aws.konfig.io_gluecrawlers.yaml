              schemaChangePolicy:
                description: SchemaChangePolicy sets the crawler's update and deletion
                  behavior.
                properties:
                  deleteBehavior:
                    description: DeleteBehavior is the behavior when the crawler finds
                      a deleted object.
                    enum:
                    - LOG
                    - DELETE_FROM_DATABASE
                    - DEPRECATE_IN_DATABASE
                    type: string
                  updateBehavior:
                    description: UpdateBehavior is the behavior when the crawler finds
                      a changed schema.
                    enum:
                    - LOG
                    - UPDATE_IN_DATABASE
                    type: string
                type: object
              tablePrefix:
                description: TablePrefix is the prefix for catalog tables the crawler
                  creates.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply at creation.
                type: object
              targets:
                description: Targets is the collection of data stores to crawl.
                properties:
                  jdbcTargets:
                    description: JDBCTargets specifies JDBC targets.
                    items:
                      description: GlueJDBCTarget specifies a JDBC data store to crawl.
                      properties:
                        connectionName:
                          description: ConnectionName is the name of the Glue connection
                            to use.
                          minLength: 1
                          type: string
                        exclusions:
                          description: Exclusions is a list of glob patterns to exclude
                            from the crawl.
                          items:
                            type: string
                          type: array
                        path:
                          description: Path is the path of the JDBC target.
                          type: string
                      required:
                      - connectionName
                      type: object
                    type: array
                  s3Targets:
                    description: S3Targets specifies Amazon S3 targets.
                    items:
                      description: GlueS3Target specifies an S3 data store to crawl.
                      properties:
                        exclusions:
                          description: Exclusions is a list of glob patterns to exclude
                            from the crawl.
                          items:
                            type: string
                          type: array
                        path:
                          description: Path is the path to the Amazon S3 target (e.g.
                            s3://bucket/prefix).
                          minLength: 1
                          type: string
                      required:
                      - path
                      type: object
                    type: array
                type: object
            required:
            - name
            - roleRef
            - targets
            type: object
          status:
