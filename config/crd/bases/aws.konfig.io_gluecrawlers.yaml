            properties:
              configuration:
                description: Configuration is a versioned JSON configuration string
                  for the crawler.
                type: string
              databaseName:
                description: DatabaseName is the Glue database where crawl results
                  are written.
                type: string
              databaseRef:
                description: |-
                  DatabaseRef is the name of a GlueDatabase CR in the same namespace.
                  Ignored when DatabaseName is set.
                type: string
              description:
                description: Description is a description of the crawler.
                type: string
              name:
