                  RoleRef references the IAM role the crawler uses to access resources
                  (either a managed IAMRole CR or a direct ARN).
                properties:
                  arn:
                    description: |-
                      ARN is a direct AWS IAM role ARN.
                      If set, Name and Namespace are ignored.
                    type: string
                  name:
                    description: Name of an IAMRole CR in the same namespace.
                    type: string
                  namespace:
                    description: Namespace of the IAMRole CR. Defaults to the referring
                      object's namespace.
                    type: string
                type: object
              schedule:
                description: Schedule is a cron expression, e.g. cron(15 12 * * ?
                  *).
