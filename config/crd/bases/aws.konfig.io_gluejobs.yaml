metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: gluejobs.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: GlueJob
    listKind: GlueJobList
    plural: gluejobs
    singular: gluejob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.jobName
      name: Job
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GlueJob is the Schema for managing Glue jobs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GlueJobSpec defines the desired state of a Glue job.
            properties:
              command:
                description: Command specifies the code the job runs.
                properties:
                  name:
                    description: |-
                      Name is the job command name: glueetl for Spark ETL, pythonshell for
                      Python shell, gluestreaming for streaming ETL.
                    minLength: 1
                    type: string
                  pythonVersion:
                    description: PythonVersion is the Python version for pythonshell
                      jobs (2 or 3).
                    type: string
                  scriptLocation:
                    description: ScriptLocation is the S3 path of the script that
                      runs the job.
                    minLength: 1
                    type: string
                required:
                - name
                - scriptLocation
                type: object
              defaultArguments:
                additionalProperties:
                  type: string
                description: DefaultArguments are default arguments for job runs.
                type: object
              description:
                description: Description is a description of the job.
                type: string
              glueVersion:
                description: GlueVersion determines the Glue runtime versions (e.g.
                  "4.0").
                type: string
              maxRetries:
                description: MaxRetries is the maximum number of retries for a failing
                  job run.
                format: int32
                minimum: 0
                type: integer
              name:
                description: Name is the name of the job. Immutable after creation.
                maxLength: 255
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              numberOfWorkers:
                description: NumberOfWorkers is the number of workers allocated when
                  the job runs.
                format: int32
                minimum: 1
                type: integer
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              roleRef:
                description: |-
                  RoleRef references the IAM role the job uses (either a managed IAMRole
                  CR or a direct ARN).
                properties:
                  arn:
                    description: |-
                      ARN is a direct AWS IAM role ARN.
                      If set, Name and Namespace are ignored.
                    type: string
                  name:
                    description: Name of an IAMRole CR in the same namespace.
                    type: string
                  namespace:
                    description: Namespace of the IAMRole CR. Defaults to the referring
                      object's namespace.
                    type: string
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply at creation.
                type: object
              timeout:
                description: Timeout is the job run timeout in minutes.
                format: int32
                minimum: 1
                type: integer
              workerType:
                description: WorkerType is the type of predefined worker allocated
                  when the job runs.
                enum:
                - Standard
                - G.1X
                - G.2X
                - G.025X
                - G.4X
                - G.8X
                - Z.2X
                type: string
            required:
            - command
            - name
            - roleRef
            type: object
          status:
            description: GlueJobStatus defines the observed state of GlueJob.
            properties:
              awsProvider:
                description: AWSProvider confirms the account and region this resource
                  was reconciled against.
                properties:
                  accountId:
                    description: AccountID the resource lives in.
                    type: string
                  name:
                    description: Name of the AWSProvider used; empty when the operator's
                      own credentials were used.
                    type: string
                  region:
                    description: Region the resource lives in (empty for global services).
                    type: string
                type: object
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              jobName:
                description: JobName is the name of the job in AWS.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
