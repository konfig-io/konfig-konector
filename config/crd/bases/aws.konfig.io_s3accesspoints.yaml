metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: s3accesspoints.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: S3AccessPoint
    listKind: S3AccessPointList
    plural: s3accesspoints
    singular: s3accesspoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.arn
      name: ARN
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: S3AccessPoint is the Schema for managing S3 access points.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: S3AccessPointSpec defines the desired state of an S3 access
              point.
            properties:
              accountId:
                description: |-
                  AccountID is the AWS account ID that owns the bucket. Required on all
                  S3 Control API calls. Immutable after creation.
                pattern: ^[0-9]{12}$
                type: string
                x-kubernetes-validations:
                - message: accountId is immutable
                  rule: self == oldSelf
              bucketRef:
                description: |-
                  BucketRef references the bucket the access point is attached to
                  (by S3Bucket CR name or direct bucket name).
                properties:
                  bucketName:
                    description: BucketName is a direct S3 bucket name (bypasses CR
                      lookup).
                    type: string
                  name:
                    description: Name is the name of an S3Bucket CR in the same namespace.
                    type: string
                type: object
              name:
                description: Name is the name of the access point. Immutable after
                  creation.
                maxLength: 50
                minLength: 3
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              publicAccessBlock:
                description: PublicAccessBlock configures public access blocking.
                properties:
                  blockPublicAcls:
                    description: BlockPublicAcls blocks public ACLs.
                    type: boolean
                  blockPublicPolicy:
                    description: BlockPublicPolicy blocks public bucket policies.
                    type: boolean
                  ignorePublicAcls:
                    description: IgnorePublicAcls ignores public ACLs.
                    type: boolean
                  restrictPublicBuckets:
                    description: RestrictPublicBuckets restricts public bucket policies.
                    type: boolean
                type: object
              vpcConfiguration:
                description: |-
                  VPCConfiguration restricts access to the given VPC. Immutable in AWS;
                  changing it requires recreating the access point.
                properties:
                  vpcRef:
                    description: VPCRef references the VPC (by VPC CR name or direct
                      VPC ID).
                    properties:
                      id:
                        description: ID is a direct AWS VPC ID (e.g. vpc-0abc1234).
                        type: string
                      name:
                        description: Name of a VPC CR in the same namespace.
                        type: string
                    type: object
                required:
                - vpcRef
                type: object
            required:
            - accountId
            - bucketRef
            - name
            type: object
          status:
            description: S3AccessPointStatus defines the observed state of S3AccessPoint.
            properties:
              alias:
                description: Alias is the bucket-style alias of the access point.
                type: string
              arn:
                description: ARN is the ARN of the access point.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
