---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: budgets.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: Budget
    listKind: BudgetList
    plural: budgets
    singular: budget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Budget is the Schema for managing AWS Budgets budgets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BudgetSpec defines the desired state of an AWS Budgets budget.
            properties:
              accountId:
                description: AccountID is the 12-digit AWS account ID that owns the
                  budget. Immutable.
                pattern: ^[0-9]{12}$
                type: string
                x-kubernetes-validations:
                - message: accountId is immutable
                  rule: self == oldSelf
              budgetName:
                description: BudgetName is the name of the budget, unique within the
                  account. Immutable.
                maxLength: 100
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: budgetName is immutable
                  rule: self == oldSelf
              budgetType:
                description: BudgetType is what the budget tracks.
                enum:
                - COST
                - USAGE
                - RI_UTILIZATION
                - RI_COVERAGE
                - SAVINGS_PLANS_UTILIZATION
                - SAVINGS_PLANS_COVERAGE
                type: string
              costFilters:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  CostFilters restrict the costs the budget tracks, e.g.
                  Service: ["Amazon Elastic Compute Cloud - Compute"].
                type: object
              limitAmount:
                description: LimitAmount is the budgeted amount, as a numeric string
                  (e.g. "100.0").
                pattern: ^[0-9]+(\.[0-9]+)?$
                type: string
              limitUnit:
                description: |-
                  LimitUnit is the unit of the limit, e.g. "USD" for COST budgets or a
                  usage unit like "GB" for USAGE budgets.
                minLength: 1
                type: string
              notifications:
                description: Notifications are alert thresholds with subscribers.
                items:
                  description: BudgetNotification attaches an alert threshold and
                    subscribers to a budget.
                  properties:
                    comparisonOperator:
                      description: ComparisonOperator compares spend against the threshold.
                      enum:
                      - GREATER_THAN
                      - LESS_THAN
                      - EQUAL_TO
                      type: string
                    notificationType:
                      description: NotificationType is whether the alert is on actual
                        or forecasted spend.
                      enum:
                      - ACTUAL
                      - FORECASTED
                      type: string
                    subscribers:
                      description: Subscribers to notify when the threshold is exceeded.
                      items:
                        description: BudgetSubscriber is a subscriber to a budget
                          notification.
                        properties:
                          address:
                            description: Address is the email address or SNS topic
                              ARN to notify.
                            minLength: 1
                            type: string
                          subscriptionType:
                            description: SubscriptionType is how notifications are
                              delivered.
                            enum:
                            - EMAIL
                            - SNS
                            type: string
                        required:
                        - address
                        - subscriptionType
                        type: object
                      minItems: 1
                      type: array
                    threshold:
                      description: |-
                        Threshold is the notification threshold value, as a numeric string
                        (e.g. "80" for 80% with thresholdType PERCENTAGE).
                      pattern: ^[0-9]+(\.[0-9]+)?$
                      type: string
                    thresholdType:
                      description: ThresholdType is PERCENTAGE or ABSOLUTE_VALUE.
                        Defaults to PERCENTAGE.
                      enum:
                      - PERCENTAGE
                      - ABSOLUTE_VALUE
                      type: string
                  required:
                  - comparisonOperator
                  - notificationType
                  - subscribers
                  - threshold
                  type: object
                type: array
              timeUnit:
                description: TimeUnit is the period after which the budget resets.
                enum:
                - DAILY
                - MONTHLY
                - QUARTERLY
                - ANNUALLY
                type: string
            required:
            - accountId
            - budgetName
            - budgetType
            - limitAmount
            - limitUnit
            - timeUnit
            type: object
          status:
            description: BudgetStatus defines the observed state of Budget.
            properties:
              budgetName:
                description: |-
                  BudgetName is the name of the budget in AWS (its primary identifier
                  together with the account ID).
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
