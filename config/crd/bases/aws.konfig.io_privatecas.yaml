---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: privatecas.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: PrivateCA
    listKind: PrivateCAList
    plural: privatecas
    singular: privateca
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.arn
      name: ARN
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PrivateCA is the Schema for managing AWS Private Certificate
          Authorities.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PrivateCASpec defines the desired state of a Private Certificate
              Authority.
            properties:
              keyAlgorithm:
                description: KeyAlgorithm for the CA key pair. Immutable after creation.
                enum:
                - RSA_2048
                - RSA_4096
                - EC_prime256v1
                - EC_secp384r1
                type: string
                x-kubernetes-validations:
                - message: keyAlgorithm is immutable
                  rule: self == oldSelf
              permanentDeletionTimeInDays:
                default: 30
                description: |-
                  PermanentDeletionTimeInDays is the restore window applied when the CA
                  is deleted (7-30 days).
                format: int32
                maximum: 30
                minimum: 7
                type: integer
              revocationConfiguration:
                description: RevocationConfiguration configures CRL support.
                properties:
                  crl:
                    description: Crl configures certificate revocation list publication.
                    properties:
                      enabled:
                        description: Enabled turns on certificate revocation list
                          publication.
                        type: boolean
                      expirationInDays:
                        description: ExpirationInDays is the CRL validity period.
                        format: int32
                        minimum: 1
                        type: integer
                      s3BucketName:
                        description: S3BucketName is the bucket CRLs are published
                          to.
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              signingAlgorithm:
                description: |-
                  SigningAlgorithm the CA uses to sign certificate requests.
                  Immutable after creation.
                enum:
                - SHA256WITHRSA
                - SHA384WITHRSA
                - SHA512WITHRSA
                - SHA256WITHECDSA
                - SHA384WITHECDSA
                - SHA512WITHECDSA
                type: string
                x-kubernetes-validations:
                - message: signingAlgorithm is immutable
                  rule: self == oldSelf
              subject:
                description: Subject is the X.500 distinguished name of the CA.
                properties:
                  commonName:
                    description: CommonName (CN) of the CA.
                    type: string
                  country:
                    description: Country is the two-letter country code (C).
                    type: string
                  locality:
                    description: Locality such as a city or town (L).
                    type: string
                  organization:
                    description: Organization (O) the CA belongs to.
                    type: string
                  organizationalUnit:
                    description: OrganizationalUnit (OU) within the organization.
                    type: string
                  state:
                    description: State or province (ST).
                    type: string
                type: object
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply.
                type: object
              type:
                description: Type of the certificate authority. Immutable after creation.
                enum:
                - ROOT
                - SUBORDINATE
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
              usageMode:
                description: UsageMode of the CA.
                enum:
                - GENERAL_PURPOSE
                - SHORT_LIVED_CERTIFICATE
                type: string
            required:
            - keyAlgorithm
            - signingAlgorithm
            - subject
            - type
            type: object
          status:
            description: PrivateCAStatus defines the observed state of PrivateCA.
            properties:
              arn:
                description: ARN of the certificate authority.
                type: string
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              status:
                description: Status is the current CA status (e.g. PENDING_CERTIFICATE,
                  ACTIVE).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
