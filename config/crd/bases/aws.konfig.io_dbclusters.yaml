---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: dbclusters.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: DBCluster
    listKind: DBClusterList
    plural: dbclusters
    singular: dbcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DBCluster is the Schema for managing Aurora DB Clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DBClusterSpec defines the desired state of an Aurora DB Cluster.
            properties:
              allocatedStorage:
                description: AllocatedStorage is the storage size in GiB (required
                  for Aurora I/O-Optimized).
                format: int32
                type: integer
              autoMinorVersionUpgrade:
                description: AutoMinorVersionUpgrade enables automatic minor version
                  upgrades during the maintenance window.
                type: boolean
              backtrackWindow:
                description: BacktrackWindow is the backtrack window in seconds for
                  Aurora MySQL.
                format: int64
                type: integer
              backupRetentionPeriod:
                description: BackupRetentionPeriod is the number of days to retain
                  automated backups.
                format: int32
                maximum: 35
                minimum: 1
                type: integer
              copyTagsToSnapshot:
                description: CopyTagsToSnapshot copies tags to automated DB snapshots.
                type: boolean
              dbClusterIdentifier:
                description: DBClusterIdentifier is the unique name for the DB cluster.
                  Immutable after creation.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: dbClusterIdentifier is immutable
                  rule: self == oldSelf
              dbClusterParameterGroupRef:
                description: DBClusterParameterGroupRef is the name of a DBClusterParameterGroup
                  CR in the same namespace.
                type: string
              dbSubnetGroupRef:
                description: DBSubnetGroupRef is the name of a DBSubnetGroup CR in
                  the same namespace.
                type: string
              deletionProtection:
                description: DeletionProtection prevents the cluster from being deleted.
                type: boolean
              enableHttpEndpoint:
                description: EnableHttpEndpoint enables the Data API for Aurora Serverless.
                type: boolean
              enableIAMDatabaseAuthentication:
                description: EnableIAMDatabaseAuthentication enables IAM database
                  authentication.
                type: boolean
              enabledCloudwatchLogsExports:
                description: EnabledCloudwatchLogsExports is the list of log types
                  to export to CloudWatch.
                items:
                  type: string
                type: array
              engine:
                description: Engine is the Aurora engine (aurora-mysql or aurora-postgresql).
                enum:
                - aurora-mysql
                - aurora-postgresql
                type: string
                x-kubernetes-validations:
                - message: engine is immutable
                  rule: self == oldSelf
              engineMode:
                description: 'EngineMode is the DB engine mode: provisioned, serverless,
                  or parallelquery.'
                enum:
                - provisioned
                - serverless
                - parallelquery
                - global
                - multimaster
                type: string
              engineVersion:
                description: EngineVersion is the version of the Aurora engine.
                type: string
              kmsKeyId:
                description: KMSKeyID is the KMS key ARN/ID for storage encryption.
                type: string
              masterUserPasswordRef:
                description: MasterUserPasswordRef references a Kubernetes Secret
                  containing the master password.
                properties:
                  key:
                    description: Key is the key within the Secret whose value to use.
                    type: string
                  name:
                    description: Name of the Kubernetes Secret.
                    type: string
                required:
                - key
                - name
                type: object
              masterUsername:
                description: MasterUsername is the login for the master user. Immutable
                  after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: masterUsername is immutable
                  rule: self == oldSelf
              networkType:
                description: 'NetworkType is the network type: IPV4 or DUAL.'
                enum:
                - IPV4
                - DUAL
                type: string
              performanceInsightsEnabled:
                description: PerformanceInsightsEnabled enables Performance Insights
                  for cluster instances.
                type: boolean
              performanceInsightsKmsKeyId:
                description: PerformanceInsightsKMSKeyID is the KMS key ARN/ID for
                  Performance Insights encryption.
                type: string
              performanceInsightsRetentionPeriod:
                description: PerformanceInsightsRetentionPeriod is the number of days
                  to retain Performance Insights data.
                format: int32
                type: integer
              port:
                description: Port is the port the cluster listens on.
                format: int32
                type: integer
              preferredBackupWindow:
                description: PreferredBackupWindow is the daily time range for automated
                  backups (e.g. "02:00-03:00").
                type: string
              preferredMaintenanceWindow:
                description: PreferredMaintenanceWindow is the weekly time range for
                  maintenance (e.g. "sun:05:00-sun:06:00").
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              serverlessV2ScalingConfig:
                description: ServerlessV2ScalingConfig defines the capacity range
                  for Aurora Serverless v2.
                properties:
                  maxCapacity:
                    description: MaxCapacity is the maximum Aurora capacity units
                      (ACUs). Maximum 128.
                    type: number
                  minCapacity:
                    description: MinCapacity is the minimum Aurora capacity units
                      (ACUs). Minimum 0.5.
                    type: number
                required:
                - maxCapacity
                - minCapacity
                type: object
              skipFinalSnapshot:
                description: SkipFinalSnapshot skips the final snapshot when the cluster
                  is deleted.
                type: boolean
              storageEncrypted:
                description: StorageEncrypted enables encryption at rest.
                type: boolean
              storageType:
                description: StorageType is the storage type (aurora, aurora-iopt1).
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are AWS resource tags to apply.
                type: object
              vpcSecurityGroupRefs:
                description: VPCSecurityGroupRefs is the list of VPC security group
                  references.
                items:
                  description: SecurityGroupRef references either a managed SecurityGroup
                    CR or a direct Security Group ID.
                  properties:
                    id:
                      description: ID is a direct AWS Security Group ID (e.g. sg-0abc1234).
                      type: string
                    name:
                      description: Name of a SecurityGroup CR in the same namespace.
                      type: string
                  type: object
                type: array
            required:
            - dbClusterIdentifier
            - engine
            - masterUserPasswordRef
            - masterUsername
            type: object
          status:
            description: DBClusterStatus defines the observed state of DBCluster.
            properties:
              awsProvider:
                description: AWSProvider confirms the account and region this resource
                  was reconciled against.
                properties:
                  accountId:
                    description: AccountID the resource lives in.
                    type: string
                  name:
                    description: Name of the AWSProvider used; empty when the operator's
                      own credentials were used.
                    type: string
                  region:
                    description: Region the resource lives in (empty for global services).
                    type: string
                type: object
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dbClusterArn:
                description: DBClusterARN is the Amazon Resource Name of the DB cluster.
                type: string
              endpoint:
                description: Endpoint is the writer endpoint hostname.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last successfully
                  reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent .metadata.generation
                  reconciled.
                format: int64
                type: integer
              readerEndpoint:
                description: ReaderEndpoint is the reader endpoint hostname.
                type: string
              status:
                description: Status is the current cluster status (available, creating,
                  modifying, deleting, etc.).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
