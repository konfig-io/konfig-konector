---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: awsproviders.aws.konfig.io
spec:
  group: aws.konfig.io
  names:
    kind: AWSProvider
    listKind: AWSProviderList
    plural: awsproviders
    shortNames:
    - awsprov
    singular: awsprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.accountId
      name: Account
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AWSProvider is a cluster-scoped credential and region target that resources
          select with spec.providerRef. One operator instance can manage any number of
          AWS accounts by defining one AWSProvider per account (or per account+region).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AWSProviderSpec defines how the operator obtains credentials for one AWS
              account (and optionally one region).
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces restricts which namespaces may reference this
                  provider. Empty means every namespace. Supports exact names and a
                  trailing "*" glob (e.g. "team-*").
                items:
                  type: string
                type: array
              durationSeconds:
                description: DurationSeconds is the assumed-role session lifetime
                  (900-43200).
                format: int32
                maximum: 43200
                minimum: 900
                type: integer
              externalId:
                description: ExternalID is passed to sts:AssumeRole when set.
                type: string
              region:
                description: |-
                  Region is the default region for resources using this provider.
                  Falls back to the operator's region when empty.
                type: string
              roleArn:
                description: |-
                  RoleARN is the IAM role to assume in the target account. When empty the
                  operator's own credentials (EKS Pod Identity) are used, which makes the
                  provider a pure region override.
                type: string
              sessionName:
                description: SessionName is the role session name; defaults to konfig-konector.
                type: string
              sourceProviderRef:
                description: |-
                  SourceProviderRef chains assumption: the role is assumed using
                  credentials from the named provider instead of the operator's own.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
            type: object
          status:
            description: AWSProviderStatus defines the observed state of AWSProvider.
            properties:
              accountId:
                description: AccountID is the account the resolved credentials belong
                  to.
                type: string
              assumedRoleArn:
                description: AssumedRoleARN is the ARN returned by sts:GetCallerIdentity.
                type: string
              conditions:
                description: Conditions describe the current state of the provider.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is the last successful credential verification.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last verified.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
