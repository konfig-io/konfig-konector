                    nested property type of AWS::CloudTrail::EventDataStore.
                  properties:
                    fieldSelectors:
                      description: Contains all selector statements in an advanced
                        event selector.
                      items:
                        description: CloudTrailEventDataStoreAdvancedFieldSelector
                          is a nested property type of AWS::CloudTrail::EventDataStore.
                        properties:
                          endsWith:
                            description: |-
                              An operator that includes events that match the last few characters of the event record field specified as the
                              value of Field.
                            items:
                              type: string
                            type: array
                          equals:
                            description: |-
                              An operator that includes events that match the exact value of the event record field specified as the value
                              of Field. This is the only valid operator that you can use with the readOnly, eventCategory, and
                              resources.type fields.
                            items:
                              type: string
                            type: array
                          field:
                            description: |-
                              A field in an event record on which to filter events to be logged. Supported fields include readOnly,
                              eventCategory, eventSource (for management events), eventName, resources.type, and resources.ARN.
                            maxLength: 1000
                            minLength: 1
                            type: string
                          notEndsWith:
                            description: |-
                              An operator that excludes events that match the last few characters of the event record field specified as the
                              value of Field.
                            items:
                              type: string
                            type: array
                          notEquals:
                            description: |-
                              An operator that excludes events that match the exact value of the event record field specified as the value
                              of Field.
                            items:
                              type: string
                            type: array
                          notStartsWith:
                            description: |-
                              An operator that excludes events that match the first few characters of the event record field specified as
                              the value of Field.
                            items:
                              type: string
                            type: array
                          startsWith:
                            description: |-
                              An operator that includes events that match the first few characters of the event record field specified as
                              the value of Field.
                            items:
                              type: string
                            type: array
                        required:
                        - field
                        type: object
                      type: array
                    name:
                      description: |-
                        An optional, descriptive name for an advanced event selector, such as "Log data events for only two S3
                        buckets".
                      maxLength: 1000
                      type: string
                  required:
                  - fieldSelectors
                  type: object
                type: array
              billingMode:
                description: The mode that the event data store will use to charge
                  for event storage.
                type: string
              contextKeySelectors:
                description: |-
                  An array that enriches event records in an existing event data store by including additional information
                  specified in individual ContexKeySelector entries. If you add ContextKeySelectors, you must set MaxEventSize
                  to Large.
                items:
                  description: CloudTrailEventDataStoreContextKeySelector is a nested
