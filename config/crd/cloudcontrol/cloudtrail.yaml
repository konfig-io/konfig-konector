                      only.
                    type: string
                required:
                - name
                type: object
              retentionPeriod:
                description: The retention period, in days.
                format: int64
                type: integer
              tags:
                items:
                  description: CFNTag is the CloudFormation Tag shape shared by generated
                    kinds.
                  properties:
                    key:
                      minLength: 1
                      type: string
                    value:
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
              terminationProtectionEnabled:
                description: Indicates whether the event data store is protected from
