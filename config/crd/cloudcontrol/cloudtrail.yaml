      openAPIV3Schema:
        description: |-
          CloudTrailEventDataStore manages AWS::CloudTrail::EventDataStore through the AWS Cloud Control API. A storage
          lake of event data against which you can run complex SQL-based queries. An event data store can include events
          that you have logged on your account from the last 7 to 2557 or 3653 days (about seven or ten years) depending
          on the selected BillingMode.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
