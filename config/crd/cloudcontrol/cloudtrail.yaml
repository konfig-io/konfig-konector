                type: boolean
              federationRoleArn:
                description: The ARN of the role used for event data store federation.
                type: string
              ingestionEnabled:
                description: Indicates whether the event data store is ingesting events.
                type: boolean
              insightSelectors:
                description: |-
                  Lets you enable Insights event logging by specifying the Insights selectors that you want to enable on an
                  existing event data store. Both InsightSelectors and InsightsDestination need to have a value in order to
                  enable Insights events on an event data store.
                items:
                  description: CloudTrailEventDataStoreInsightSelector is a nested
                    property type of AWS::CloudTrail::EventDataStore.
                  properties:
                    insightType:
                      description: The type of Insights to log on an event data store.
                      type: string
                  type: object
                type: array
              insightsDestination:
                description: |-
                  Specifies the ARN of the event data store that will collect Insights events. Both InsightSelectors and
                  InsightsDestination need to have a value in order to enable Insights events on an event data store
                type: string
              kmsKeyId:
                description: |-
                  Specifies the KMS key ID to use to encrypt the events delivered by CloudTrail. The value can be an alias name
                  prefixed by 'alias/', a fully specified ARN to an alias, a fully specified ARN to a key, or a globally unique
                  identifier.
                type: string
              maxEventSize:
                description: |-
                  Specifies the maximum size allowed for the event. Valid values are Standard and Large. If you add
                  ContextKeySelectors, this value must be set to Large.
                enum:
                - Standard
                - Large
                type: string
              multiRegionEnabled:
                description: |-
                  Indicates whether the event data store includes events from all regions, or only from the region in which it
                  was created.
                type: boolean
              name:
                description: The name of the event data store.
                type: string
              organizationEnabled:
                description: Indicates that an event data store is collecting logged
                  events for an organization.
                type: boolean
              providerRef:
