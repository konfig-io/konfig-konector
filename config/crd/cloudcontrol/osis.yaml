                          items:
                            type: string
                          type: array
                        subnetIds:
                          description: A list of subnet IDs associated with the VPC
                            endpoint.
                          items:
                            type: string
                          type: array
                        vpcAttachmentOptions:
                          description: Options for attaching a VPC to the pipeline.
                          properties:
                            attachToVpc:
                              description: Whether the pipeline should be attached
                                to the provided VPC
                              type: boolean
                            cidrBlock:
                              description: The CIDR block to be reserved for OpenSearch
                                Ingestion to create elastic network interfaces (ENIs).
                              type: string
                          required:
                          - attachToVpc
                          - cidrBlock
                          type: object
                        vpcEndpointManagement:
                          description: |-
                            Defines whether you or Amazon OpenSearch Ingestion service create and manage the VPC endpoint configured for
                            the pipeline.
                          enum:
                          - CUSTOMER
                          - SERVICE
                          type: string
                      required:
                      - subnetIds
                      type: object
                  type: object
                type: array
            type: object
        type: object
