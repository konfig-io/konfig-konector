                    AWS::OSIS::Pipeline.
                  properties:
                    vpcEndpointId:
                      description: The unique identifier of the endpoint.
                      type: string
                    vpcId:
                      description: The ID for your VPC. AWS Privatelink generates
                        this value when you create a VPC.
                      type: string
                    vpcOptions:
                      description: OSISPipelineVpcOptions is a nested property type
