  names:
    kind: OSISPipeline
    listKind: OSISPipelineList
    plural: osispipelines
    singular: osispipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.identifier
      name: Identifier
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OSISPipeline manages AWS::OSIS::Pipeline through the AWS Cloud Control API. An OpenSearch Ingestion Service
          Data Prepper pipeline running Data Prepper.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OSISPipelineSpec is the desired state of AWS::OSIS::Pipeline.
            properties:
              bufferOptions:
                description: OSISPipelineBufferOptions is a nested property type of
                  AWS::OSIS::Pipeline.
                properties:
                  persistentBufferEnabled:
                    description: Whether persistent buffering should be enabled.
                    type: boolean
                required:
                - persistentBufferEnabled
                type: object
              encryptionAtRestOptions:
                description: OSISPipelineEncryptionAtRestOptions is a nested property
                  type of AWS::OSIS::Pipeline.
                properties:
                  kmsKeyArn:
                    description: The KMS key to use for encrypting data. By default
                      an AWS owned key is used
                    type: string
                required:
                - kmsKeyArn
                type: object
              logPublishingOptions:
                description: OSISPipelineLogPublishingOptions is a nested property
                  type of AWS::OSIS::Pipeline.
                properties:
                  cloudWatchLogDestination:
                    description: The destination for OpenSearch Ingestion Service
                      logs sent to Amazon CloudWatch.
                    properties:
                      logGroup:
                        maxLength: 512
                        minLength: 1
                        type: string
                    required:
                    - logGroup
                    type: object
                  isLoggingEnabled:
                    description: Whether logs should be published.
                    type: boolean
                type: object
              maxUnits:
                description: The maximum pipeline capacity, in Ingestion OpenSearch
                  Compute Units (OCUs).
                format: int64
                maximum: 384
                minimum: 1
                type: integer
              minUnits:
                description: The minimum pipeline capacity, in Ingestion OpenSearch
                  Compute Units (OCUs).
                format: int64
                maximum: 384
                minimum: 1
                type: integer
              pipelineConfigurationBody:
                description: The Data Prepper pipeline configuration.
                maxLength: 100000
                minLength: 1
                type: string
              pipelineName:
                description: |-
                  Name of the OpenSearch Ingestion Service pipeline to create. Pipeline names are unique across the pipelines
                  owned by an account within an AWS Region.
                  Create-only in AWS: changing it requires replacing the resource.
