                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  default provider, then the operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              resourcePolicy:
                description: OSISPipelineResourcePolicy is a nested property type
                  of AWS::OSIS::Pipeline.
                properties:
                  policy:
                    x-kubernetes-preserve-unknown-fields: true
                required:
                - policy
                type: object
              tags:
                description: An array of key-value pairs to apply to this resource.
                items:
                  description: CFNTag is the CloudFormation Tag shape shared by generated
                    kinds.
                  properties:
                    key:
                      minLength: 1
                      type: string
                    value:
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
              vpcOptions:
                description: OSISPipelineVpcOptions is a nested property type of AWS::OSIS::Pipeline.
                properties:
                  securityGroupIds:
                    description: A list of security groups associated with the VPC
                      endpoint.
                    items:
                      type: string
                    type: array
                  subnetIds:
                    description: A list of subnet IDs associated with the VPC endpoint.
                    items:
                      type: string
                    type: array
                  vpcAttachmentOptions:
                    description: Options for attaching a VPC to the pipeline.
                    properties:
                      attachToVpc:
                        description: Whether the pipeline should be attached to the
                          provided VPC
                        type: boolean
                      cidrBlock:
                        description: The CIDR block to be reserved for OpenSearch
                          Ingestion to create elastic network interfaces (ENIs).
                        type: string
                    required:
                    - attachToVpc
                    - cidrBlock
                    type: object
                  vpcEndpointManagement:
                    description: |-
                      Defines whether you or Amazon OpenSearch Ingestion service create and manage the VPC endpoint configured for
                      the pipeline.
                    enum:
                    - CUSTOMER
                    - SERVICE
                    type: string
                required:
                - subnetIds
                type: object
            required:
            - maxUnits
            - minUnits
            - pipelineConfigurationBody
            - pipelineName
            type: object
          status:
            description: OSISPipelineStatus is the observed state of AWS::OSIS::Pipeline.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              identifier:
                description: Identifier is the Cloud Control primary identifier of
                  the resource.
                type: string
              ingestEndpointUrls:
                description: |-
                  A list of endpoints that can be used for ingesting data into a pipeline
                  Read-only: reported by AWS after creation.
                items:
                  type: string
                type: array
              lastSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              operation:
                description: Operation is the in-flight operation (CREATE, UPDATE,
                  DELETE).
                type: string
              operationStatus:
                description: OperationStatus is the last reported operation status.
                type: string
              pipelineArn:
                description: |-
                  The Amazon Resource Name (ARN) of the pipeline.
                  Read-only: reported by AWS after creation.
                maxLength: 78
                type: string
              requestToken:
