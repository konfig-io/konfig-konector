                      NestingLevel is set to "one".
                    format: int64
                    type: integer
                  extractDocId:
                    description: Specifies the document ID. Use this setting when
                      NestingLevel is set to "none"
                    type: boolean
                  nestingLevel:
                    description: Specifies either document or table mode.
                    type: string
                  secretsManagerAccessRoleArn:
                    description: |-
                      The full Amazon Resource Name (ARN) of the IAM role that specifies AWS DMS as the trusted entity and grants
                      the required permissions to access the value in SecretsManagerSecret. The role must allow the iam:PassRole
                      action. SecretsManagerSecret has the value of the AWS Secrets Manager secret that allows access to the
                      DocumentDB endpoint.
                    type: string
                  secretsManagerSecretId:
                    description: |-
                      The full Amazon Resource Name (ARN) of the IAM role that specifies AWS DMS as the trusted entity and grants
                      the required permissions to access the value in SecretsManagerSecret. The role must allow the iam:PassRole
                      action. SecretsManagerSecret has the value of the AWS Secrets Manager secret that allows access to the
                      DocumentDB endpoint.
                    type: string
                type: object
              dynamoDbSettings:
                description: Settings in JSON format for the target Amazon DynamoDB
                  endpoint
                properties:
                  serviceAccessRoleArn:
                    description: |-
                      The Amazon Resource Name (ARN) used by the service to access the IAM role. The role must allow the
                      iam:PassRole action.
                    type: string
                type: object
              elasticsearchSettings:
                description: Settings in JSON format for the target OpenSearch endpoint
