                  endpointUri:
                    description: |-
                      The endpoint for the OpenSearch cluster. AWS DMS uses HTTPS if a transport protocol (either HTTP or HTTPS)
                      isn't specified.
                    type: string
                  errorRetryDuration:
                    description: The maximum number of seconds for which DMS retries
                      failed API requests to the OpenSearch cluster.
                    format: int64
                    type: integer
                  fullLoadErrorPercentage:
                    description: The maximum percentage of records that can fail to
                      be written before a full load operation stops.
                    format: int64
                    type: integer
                  serviceAccessRoleArn:
                    description: |-
                      The Amazon Resource Name (ARN) used by the service to access the IAM role. The role must allow the
                      iam:PassRole action.
                    type: string
                type: object
              endpointIdentifier:
                description: |-
                  The database endpoint identifier. Identifiers must begin with a letter and must contain only ASCII letters,
                  digits, and hyphens. They can't end with a hyphen, or contain two consecutive hyphens.
                type: string
              endpointType:
                description: The type of endpoint. Valid values are source and target.
                type: string
              engineName:
                description: The type of engine for the endpoint, depending on the
                  EndpointType value.
                type: string
              extraConnectionAttributes:
                description: Additional attributes associated with the connection
                type: string
              gcpMySQLSettings:
                description: Settings in JSON format for the source GCP MySQL endpoint
