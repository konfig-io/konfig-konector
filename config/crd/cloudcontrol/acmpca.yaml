                              type: string
                            value:
                              description: Specifies the attribute value of relative
                                distinguished name (RDN).
                              type: string
                          required:
                          - objectIdentifier
                          - value
                          type: object
                        type: array
                      distinguishedNameQualifier:
                        description: Disambiguating information for the certificate
                          subject.
                        type: string
                      generationQualifier:
                        description: |-
                          Typically a qualifier appended to the name of an individual. Examples include Jr. for junior, Sr. for senior,
