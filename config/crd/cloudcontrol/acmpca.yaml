                type: object
              validityNotBefore:
                description: |-
                  Information describing the start of the validity period of the certificate. This parameter sets the “Not
                  Before" date for the certificate. By default, when issuing a certificate, PCAshort sets the "Not Before" date
                  to the issuance time minus 60 minutes. This compensates for clock inconsistencies across computer systems. The
                  ``ValidityNotBefore`` parameter can be used to customize the “Not Befor...
