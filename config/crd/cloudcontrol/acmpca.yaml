                                type: object
                              type: array
                          required:
                          - certPolicyId
                          type: object
                        type: array
                      customExtensions:
                        description: |-
                          Contains a sequence of one or more X.509 extensions, each of which consists of an object identifier (OID), a
                          base64-encoded value, and the critical flag. For more information, see the [Global OID reference
