                          crlSign:
                            description: Key can be used to sign CRLs.
                            type: boolean
                          dataEncipherment:
                            description: Key can be used to decipher data.
                            type: boolean
                          decipherOnly:
                            description: Key can be used only to decipher data.
                            type: boolean
                          digitalSignature:
                            description: Key can be used for digital signing.
                            type: boolean
                          encipherOnly:
                            description: Key can be used only to encipher data.
                            type: boolean
                          keyAgreement:
                            description: Key can be used in a key-agreement protocol.
                            type: boolean
                          keyCertSign:
                            description: Key can be used to sign certificates.
                            type: boolean
                          keyEncipherment:
                            description: Key can be used to encipher data.
                            type: boolean
                          nonRepudiation:
                            description: Key can be used for non-repudiation.
                            type: boolean
                        type: object
                      subjectAlternativeNames:
                        description: |-
                          The subject alternative name extension allows identities to be bound to the subject of the certificate. These
                          identities may be included in addition to or in place of the identity in the subject field of the certificate.
                        items:
                          description: ACMPCACertificateGeneralName is a nested property
                            type of AWS::ACMPCA::Certificate.
                          properties:
                            directoryName:
                              description: |-
                                Contains information about the certificate subject. The certificate can be one issued by your private
                                certificate authority (CA) or it can be your private CA certificate. The Subject field in the certificate
                                identifies the entity that owns or controls the public key in the certificate. The entity can be a user,
                                computer, device, or service. The Subject must contain an X.500 distinguished name (...
                              properties:
                                commonName:
                                  description: |-
                                    For CA and end-entity certificates in a private PKI, the common name (CN) can be any string within the length
