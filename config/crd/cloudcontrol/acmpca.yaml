                                  type: string
                                generationQualifier:
                                  description: |-
                                    Typically a qualifier appended to the name of an individual. Examples include Jr. for junior, Sr. for senior,
                                    and III for third.
                                  type: string
                                givenName:
                                  description: First name.
                                  type: string
                                initials:
                                  description: |-
                                    Concatenation that typically contains the first letter of the *GivenName*, the first letter of the middle name
                                    if one exists, and the first letter of the *Surname*.
                                  type: string
                                locality:
                                  description: The locality (such as a city or town)
                                    in which the certificate subject is located.
                                  type: string
                                organization:
                                  description: Legal name of the organization with
                                    which the certificate subject is affiliated.
                                  type: string
                                organizationalUnit:
                                  description: |-
                                    A subdivision or unit of the organization (such as sales or finance) with which the certificate subject is
                                    affiliated.
                                  type: string
                                pseudonym:
                                  description: |-
                                    Typically a shortened version of a longer *GivenName*. For example, Jonathan is often shortened to John.
                                    Elizabeth is often shortened to Beth, Liz, or Eliza.
                                  type: string
                                serialNumber:
                                  description: The certificate serial number.
                                  type: string
                                state:
                                  description: State in which the subject of the certificate
                                    is located.
                                  type: string
                                surname:
                                  description: |-
                                    Family name. In the US and the UK, for example, the surname of an individual is ordered last. In Asian
                                    cultures the surname is typically ordered first.
                                  type: string
                                title:
                                  description: A title such as Mr. or Ms., which is
                                    pre-pended to the name to refer formally to the
                                    certificate subject.
                                  type: string
                              type: object
                            dnsName:
                              description: Represents ``GeneralName`` as a DNS name.
                              type: string
                            ediPartyName:
                              description: Represents ``GeneralName`` as an ``EdiPartyName``
                                object.
                              properties:
