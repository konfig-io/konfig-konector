    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CURReportDefinition manages AWS::CUR::ReportDefinition through the AWS Cloud Control API. The
          AWS::CUR::ReportDefinition resource creates a Cost & Usage Report with user-defined settings. You can use this
          resource to define settings like time granularity (hourly, daily, monthly), file format (Parquet, CSV), and S3
          bucket for delivery of these reports.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CURReportDefinitionSpec is the desired state of AWS::CUR::ReportDefinition.
            properties:
              additionalArtifacts:
                description: A list of manifests that you want Amazon Web Services
                  to create for this report.
                items:
                  type: string
                type: array
              additionalSchemaElements:
                description: |-
                  A list of strings that indicate additional content that Amazon Web Services includes in the report, such as
                  individual resource IDs.
                  Create-only in AWS: changing it requires replacing the resource.
                items:
                  type: string
                type: array
              billingViewArn:
                description: |-
                  The Amazon resource name of the billing view. You can get this value by using the billing view service public
                  APIs.
                  Create-only in AWS: changing it requires replacing the resource.
                maxLength: 128
                type: string
              compression:
                description: The compression format that AWS uses for the report.
                enum:
                - ZIP
                - GZIP
                - Parquet
                type: string
              format:
                description: The format that AWS saves the report in.
                enum:
                - textORcsv
                - Parquet
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the AWSProvider (account/region) this resource is
                  reconciled against. Defaults to the namespace annotation, then the
                  default provider, then the operator's own credentials.
                properties:
                  name:
                    description: Name of a cluster-scoped AWSProvider.
                    minLength: 1
                    type: string
                  region:
                    description: Region overrides the provider's region for this resource
                      only.
                    type: string
                required:
                - name
                type: object
              refreshClosedReports:
                description: |-
                  Whether you want Amazon Web Services to update your reports after they have been finalized if Amazon Web
                  Services detects charges related to previous months. These charges can include refunds, credits, or support
                  fees.
                type: boolean
              reportName:
                description: |-
                  The name of the report that you want to create. The name must be unique, is case sensitive, and can't include
                  spaces.
                  Create-only in AWS: changing it requires replacing the resource.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: reportName is immutable
                  rule: self == oldSelf
              reportVersioning:
                description: |-
                  Whether you want Amazon Web Services to overwrite the previous version of each report or to deliver the report
                  in addition to the previous versions.
                  Create-only in AWS: changing it requires replacing the resource.
                enum:
                - CREATE_NEW_REPORT
                - OVERWRITE_REPORT
                type: string
                x-kubernetes-validations:
                - message: reportVersioning is immutable
                  rule: self == oldSelf
              s3Bucket:
                description: The S3 bucket where AWS delivers the report.
                maxLength: 256
                minLength: 1
                type: string
              s3Prefix:
                description: The prefix that AWS adds to the report name when AWS
                  delivers the report. Your prefix can't include spaces.
                maxLength: 256
                minLength: 1
                type: string
              s3Region:
                description: The region of the S3 bucket that AWS delivers the report
                  into.
                type: string
              tags:
                items:
                  description: CFNTag is the CloudFormation Tag shape shared by generated
                    kinds.
                  properties:
                    key:
                      minLength: 1
                      type: string
                    value:
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
              timeUnit:
                description: |-
                  The granularity of the line items in the report.
                  Create-only in AWS: changing it requires replacing the resource.
                enum:
                - HOURLY
                - DAILY
                - MONTHLY
                type: string
                x-kubernetes-validations:
                - message: timeUnit is immutable
                  rule: self == oldSelf
            required:
            - compression
            - format
            - refreshClosedReports
            - reportName
            - reportVersioning
            - s3Bucket
            - s3Prefix
            - s3Region
            - timeUnit
            type: object
          status:
            description: CURReportDefinitionStatus is the observed state of AWS::CUR::ReportDefinition.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              identifier:
                description: Identifier is the Cloud Control primary identifier of
                  the resource.
                type: string
              lastSyncTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              operation:
                description: Operation is the in-flight operation (CREATE, UPDATE,
                  DELETE).
                type: string
              operationStatus:
                description: OperationStatus is the last reported operation status.
                type: string
              requestToken:
                description: RequestToken tracks an in-flight asynchronous operation.
                type: string
            type: object
        type: object
