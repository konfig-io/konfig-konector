# permissions for end users to view iamroles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: iamrole-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: konfig-konector
    app.kubernetes.io/part-of: konfig-konector
    app.kubernetes.io/managed-by: kustomize
  name: iamrole-viewer-role
rules:
- apiGroups:
  - aws.konfig.io
  resources:
  - iamroles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aws.konfig.io
  resources:
  - iamroles/status
  verbs:
  - get
