name: CI/CD Pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write # GHCR push
  id-token: write # OIDC federation for AWS ECR push

env:
  ENVTEST_K8S_VERSION: "1.29.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install envtest binaries
        run: |
          mkdir -p bin/k8s/1.29.0-linux-amd64
          curl -sL "https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v${ENVTEST_K8S_VERSION}/envtest-v${ENVTEST_K8S_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C bin/k8s/1.29.0-linux-amd64 --strip-components=2

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Test
        run: |
          KUBEBUILDER_ASSETS="$PWD/bin/k8s/1.29.0-linux-amd64" \
            go test $(go list ./... | grep -v /e2e) -count=1

      - name: Verify manifests are up to date
        run: |
          make manifests generate
          if ! git diff --quiet; then
            echo "::error::config/ or zz_generated files are stale — run 'make manifests generate' and commit"
            git diff --stat
            exit 1
          fi

  # Builds and pushes the operator image to ECR. Configure these repository
  # variables (Settings → Secrets and variables → Actions → Variables):
  #   AWS_CI_ROLE_ARN — IAM role assumable via GitHub OIDC with ECR push rights
  #   AWS_REGION      — e.g. us-east-1
  #   ECR_REPOSITORY  — e.g. konfig-konector
  # The job is skipped until AWS_CI_ROLE_ARN is set. Image tags: <git sha>,
  # plus "latest" on main. Argo CD / GitOps tag bumps are intentionally left
  # to the consuming environment's pipeline.
  build_and_push:
    needs: [test]
    if: github.event_name == 'push' && vars.AWS_CI_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -f ./Dockerfile .
          docker push "$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  # Public operator image on GitHub Container Registry. No secrets to configure:
  # the workflow's GITHUB_TOKEN has packages:write. Tags: the git sha always,
  # "latest" on main, and the semver (v0.11.5 -> 0.11.5 and 0.11) on version
  # tags. Multi-arch (linux/amd64 + linux/arm64). The package must be set to
  # public once in the GitHub UI (Packages -> konfig-konector -> settings).
  publish_ghcr:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/konfig-konector
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
